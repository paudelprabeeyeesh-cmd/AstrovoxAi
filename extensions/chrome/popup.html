<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrovox AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <span class="title">Astrovox AI</span>
    </div>
    <div class="popup-body">
      <textarea id="input" class="popup-input" placeholder="Ask anything..." rows="3"></textarea>
      <button id="send" class="popup-button">Send</button>
      <div id="response" class="popup-response" style="display:none;"></div>
    </div>
    <div class="popup-footer">
      <a href="options.html" target="_blank">Settings</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
