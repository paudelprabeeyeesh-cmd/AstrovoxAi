<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astrovox AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <span class="title">Astrovox AI</span>
    </div>
    <div class="popup-body">
      <textarea id="input" class="popup-input" placeholder="Ask anything..." rows="3"></textarea>
      <button id="send" class="popup-button">Send</button>
      <div id="response" class="popup-response" style="display:none;"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
