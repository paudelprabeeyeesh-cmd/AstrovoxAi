global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: astrovox
    environment: production

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

# Load recording rules and alert rules
rule_files:
  - '/etc/prometheus/recording_rules.yml'
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']

  - job_name: 'astrovox-backend'
    static_configs:
    - targets: ['astrovox-backend:8000']
    metrics_path: '/metrics/prometheus'
    scrape_interval: 15s

  - job_name: 'astrovox-health'
    static_configs:
    - targets: ['astrovox-backend:8000']
    metrics_path: '/health'
    scrape_interval: 30s

