services:
  - type: web
    name: astrovox-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --prefer-binary -r 02-Backend/requirements.txt
    startCommand: cd 02-Backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ASTROVOX_DB
        value: /tmp/astrovox.db
      - key: REDIS_URL
        value: redis://localhost:6379
      - key: PYTHON_VERSION
        value: 3.12.0
