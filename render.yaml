services:
  - type: web
    name: astrovox-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: astrovox-redis
          property: connectionString
      - key: ASTROVOX_DB
        value: /data/astrovox.db
