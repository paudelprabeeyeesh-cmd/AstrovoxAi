# Render Blueprint for AstrovoxAI
# Docs: https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: astrovox-backend
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://astrovox.ai,https://www.astrovox.ai
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: 120/minute
      - key: DAILY_AI_LIMIT
        value: 50
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: METRICS_ENABLED
        value: "true"

  # Redis (optional, for caching)
  - type: redis
    name: astrovox-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
