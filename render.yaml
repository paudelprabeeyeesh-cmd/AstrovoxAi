services:
  - type: web
    name: astrovox-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ASTROVOX_DB
        value: /data/astrovox.db
      - key: REDIS_URL
        value: redis://localhost:6379
