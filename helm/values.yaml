replicaCount: 3

namespace: astrovox

image:
  repository: ghcr.io/astrovoxai/backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}

podAnnotations:
  sidecar.istio.io/inject: "false"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "120"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: astrovox.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: astrovox-tls
      hosts:
        - astrovox.ai

configmap:
  data:
    APP_ENV: production
    LOG_LEVEL: info
    REDIS_URL: redis://redis-master:6379
    DATABASE_URL: postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
    RATE_LIMIT: "120/minute"
    DAILY_AI_LIMIT: "50"
    ALLOWED_ORIGINS: https://astrovox.ai,https://www.astrovox.ai

secret:
  data:
    DATABASE_URL: postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
    REDIS_URL: redis://redis-master:6379
    SECRET_KEY: change-me-in-production
    OPENAI_API_KEY: change-me

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: astrovox
        topologyKey: kubernetes.io/hostname

pdb:
  create: true
  minAvailable: 2
  maxUnavailable: ""

networkPolicy:
  create: true

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 20Gi
  storageClass: ""
  username: astrovox
  password: astrovox_pass
  database: astrovox

redis:
  enabled: true
  image: redis:7-alpine
  storage: 8Gi
  storageClass: ""
  password: ""
  master:
    count: 1

monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      path: /metrics
  grafana:
    enabled: true
    adminPassword: admin
