replicaCount: 3

namespace: astrovox

image:
  repository: ghcr.io/paudelprabeeyeesh-cmd/astrovox-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: api.astrovox.example.com
  tls:
    enabled: true
    secretName: astrovox-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

configmap:
  data:
    APP_ENV: production
    LOG_LEVEL: info
    REDIS_URL: redis://redis-master:6379
    METRICS_ENABLED: "true"

secret:
  # These values should be injected via --set, external secrets management, or CI/CD
  # Do NOT commit plaintext credentials to version control
  data:
    DATABASE_URL: postgresql://astrovox:changeme@postgres:5432/astrovox
    REDIS_PASSWORD: changeme
    REDIS_URL: redis://redis-master:6379
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: changeme
    JAEGER_URL: http://jaeger:14268/api/traces
    OPENAI_API_KEY: changeme
    ANTHROPIC_API_KEY: changeme
    GOOGLE_GENERATIVEAI_API_KEY: changeme
    JWT_SECRET_KEY: changeme

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 20Gi

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  password: changeme

jaeger:
  enabled: true
  image: jaegertracing/all-in-one:1.50

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
    adminPassword: admin
