replicaCount: 3

namespace: astrovox

image:
  repository: ghcr.io/astrovoxai/backend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}

podAnnotations:
  sidecar.istio.io/inject: "false"
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "120"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: astrovox.ai
      paths:
        - path: /
          pathType: Prefix
    - host: api.astrovox.ai
      paths:
        - path: /
          pathType: Prefix
    - host: cdn.astrovox.ai
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: astrovox-tls
      hosts:
        - astrovox.ai
        - api.astrovox.ai
        - cdn.astrovox.ai

configmap:
  data:
    APP_ENV: production
    LOG_LEVEL: info
    REDIS_URL: redis://redis-master:6379
    REDIS_SENTINEL_URL: redis://redis-sentinel:26379
    DATABASE_URL: postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
    DATABASE_REPLICA_URL: postgresql://astrovox:astrovox_pass@postgres-replica:5432/astrovox
    RABBITMQ_URL: amqp://astrovox:astrovox_pass@rabbitmq:5672
    MINIO_ENDPOINT: minio.minio.svc.cluster.local:9000
    MINIO_BUCKET: astrovox-storage
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_REGION: us-east-1
    CELERY_BROKER_URL: redis://redis-master:6379/1
    CELERY_RESULT_BACKEND: redis://redis-master:6379/2
    CLOUDFLARE_ZONE_ID: ""
    API_GATEWAY_URL: http://kong-kong-proxy.kong.svc.cluster.local:80
    CDN_BASE_URL: https://cdn.astrovox.ai
    ALLOWED_ORIGINS: https://astrovox.ai,https://www.astrovox.ai,https://app.astrovox.ai
    RATE_LIMIT: "120/minute"
    DAILY_AI_LIMIT: "50"

secret:
  data:
    DATABASE_URL: postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
    DATABASE_REPLICA_URL: postgresql://astrovox:astrovox_pass@postgres-replica:5432/astrovox
    REDIS_URL: redis://redis-master:6379
    REDIS_SENTINEL_URL: redis://redis-sentinel:26379
    RABBITMQ_URL: amqp://astrovox:astrovox_pass@rabbitmq:5672
    RABBITMQ_ERLANG_COOKIE: secure-cookie-value
    RABBITMQ_USER: astrovox
    RABBITMQ_PASSWORD: astrovox_pass
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: astrovox-storage
    MINIO_ENDPOINT: minio.minio.svc.cluster.local:9000
    OPENAI_API_KEY: change-me
    ANTHROPIC_API_KEY: change-me
    GOOGLE_API_KEY: change-me
    JWT_SECRET: change-me-in-production
    SECRET_KEY: change-me-in-production
    KONG_ADMIN_API_KEY: change-me
    CLOUDFLARE_API_TOKEN: change-me
    CLOUDFLARE_ZONE_ID: your-zone-id

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: astrovox
        topologyKey: kubernetes.io/hostname

pdb:
  create: true
  minAvailable: 2
  maxUnavailable: ""

networkPolicy:
  create: true

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: astrovox_pass
    sentinel: true
    sentinelPassword: ""
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  sentinel:
    enabled: true
    quorum: 2
  service:
    type: ClusterIP
    port: 6379

postgresql:
  enabled: true
  auth:
    enablePostgresUser: false
    username: astrovox
    password: astrovox_pass
    database: astrovox
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  readReplicas:
    replicaCount: 1
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  pgvector:
    enabled: true
  service:
    type: ClusterIP
    port: 5432

minio:
  enabled: true
  mode: standalone
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  buckets:
    - name: astrovox-storage
      policy: none
      purge: false
    - name: astrovox-uploads
      policy: none
      purge: false
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001

rabbitmq:
  enabled: true
  replicaCount: 3
  auth:
    username: astrovox
    password: astrovox_pass
    erlangCookie: secure-cookie-value
  service:
    type: ClusterIP
    ports:
      amqp: 5672
      management: 15672
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kong:
  enabled: true
  image:
    registry: ""
    repository: kong
    pullPolicy: IfNotPresent
    tag: "3.5"
  env:
    database: "off"
    admin_listen: "0.0.0.0:8001"
    proxy_listen: "0.0.0.0:8000"
    nginx_worker_processes: "2"
  deployment:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  proxy:
    enabled: true
    type: LoadBalancer
    tls:
      enabled: true
    http:
      servicePort: 80
      containerPort: 8000
    https:
      servicePort: 443
      containerPort: 8443
    serviceAnnotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  admin:
    enabled: true
    type: NodePort
    http:
      servicePort: 8001
      containerPort: 8001
    tls:
      enabled: true
  plugins:
    - name: rate-limiting
      config:
        minute: 120
        hour: 7200
        policy: local
    - name: cors
      config:
        origins:
        - https://astrovox.ai
        - https://www.astrovox.ai
        methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        headers:
        - Authorization
        - Content-Type
        - Accept
        credentials: true
        max_age: 86400
    - name: prometheus
    - name: oauth2-introspection
    - name: jwt
    - name: key-auth

monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      path: /metrics
  grafana:
    enabled: true
    adminPassword: admin
