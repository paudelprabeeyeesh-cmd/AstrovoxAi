# Default values for kong.
# This is a YAML-formatted file.

env:
  database: "off"
  admin_listen: "0.0.0.0:8001"
  proxy_listen: "0.0.0.0:8000"
  nginx_worker_processes: "2"

deployment:
  replicas: 2
  podAnnotations:
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

proxy:
  enabled: true
  type: LoadBalancer
  tls:
    enabled: true
  http:
    servicePort: 80
    containerPort: 8000
  https:
    servicePort: 443
    containerPort: 8443
  serviceAnnotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

admin:
  enabled: true
  type: NodePort
  http:
    servicePort: 8001
    containerPort: 8001
  tls:
    enabled: true

plugins:
  - name: rate-limiting
    config:
      minute: 120
      hour: 7200
      policy: local
  - name: cors
    config:
      origins:
      - https://astrovox.ai
      - https://www.astrovox.ai
      methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      headers:
      - Authorization
      - Content-Type
      - Accept
      credentials: true
      max_age: 86400
  - name: prometheus
  - name: oauth2-introspection
  - name: jwt
  - name: key-auth
