{{- if .Values.auth.rootUser }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.auth.rootUser | quote }}
  root-password: {{ .Values.auth.rootPassword | quote }}
{{- end }}
