
apiVersion: v1
kind: ConfigMap
metadata:
  name: astrovox-backend-config
data:
  LOG_LEVEL: "info"
  WORKERS: "4"
  MAX_CONNECTIONS: "1000"
  QUEUE_SIZE: "100"
  BACKPRESSURE_MAX_CONCURRENCY: "10"
  REDIS_URL: "redis://redis:6379"
  JAEGER_URL: "http://jaeger:14268/api/traces"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  APP_ENV: "production"
