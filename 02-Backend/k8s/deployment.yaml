apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrovox-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astrovox-backend
  template:
    metadata:
      labels:
        app: astrovox-backend
    spec:
      containers:
      - name: astrovox-backend
        image: astrovox/backend:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        envFrom:
        - configMapRef:
            name: astrovox-backend-config
        - secretRef:
            name: astrovox-backend-secret
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8000
          periodSeconds: 10
