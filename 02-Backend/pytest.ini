[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -p no:cacheprovider keeps the (now gitignored) .pytest_cache out of the
# working tree; --strict-markers catches unregistered markers in CI.
addopts = -v --tb=short --strict-markers --import-mode=prepend -p no:cacheprovider
asyncio_mode = auto
pythonpath = .

# D01-11: the test directories below cover experimental modules only
# (see docs/MODULE_INVENTORY.md). Their import surface drifted from the
# packages they test, so they are not collected by the product suite; the
# product test run lives on the remaining directories.
#
# tests/security, tests/services and tests/storage used to be on this list
# too. That silently removed the security suite from the product run, so a
# per-test timeout never observed it and the only evidence it passed was a
# manual invocation nobody runs in CI. A suite that is not collected cannot
# be a gate, so they were re-included; they pass, and the one storage
# failure (`test_rotate_backups_limits_count`) was a real backup-collision
# bug, not a flake.
norecursedirs =
    tests/advanced_optimization
    tests/ai_core
    tests/mental_simulation
    tests/plugin_system
    tests/production_readiness
    tests/reasoning_scaffolds
    tests/experimental

markers =
    slow: marks tests as slow
    integration: marks tests as integration
    e2e: marks tests as end-to-end
    security: marks tests as security
    chaos: marks tests as chaos engineering
    mutation: marks tests as mutation testing
    benchmark: marks tests as benchmarks
    property: marks tests as property-based testing
    visual: marks tests as visual regression
filterwarnings =
    ignore::pytest.PytestCollectionWarning:system_integration.integration_testing
