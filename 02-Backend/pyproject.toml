[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "ARG"]
ignore = ["E501"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.bandit]
# Skip tests that are noisy for this codebase; still fail on HIGH+.
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]
