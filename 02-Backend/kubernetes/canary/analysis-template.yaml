apiVersion: v1
kind: ConfigMap
metadata:
  name: astrovox-api-canary-config
  namespace: astrovox-production
data:
  analysis.json: |
    {
      "steps": [
        {"setWeight": 10, "pause": {"duration": "60s"}},
        {"setWeight": 25, "pause": {"duration": "120s"}},
        {"setWeight": 50, "pause": {"duration": "180s"}},
        {"setWeight": 100, "pause": {"duration": "60s"}}
      ],
      "failureThreshold": 5,
      "analysisInterval": 60,
      "successThreshold": 90
    }
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: astrovox-api-analysis
  namespace: astrovox-production
spec:
  args:
  - name: service-name
    value: astrovox-api
  metrics:
  - name: error-rate
    interval: 60s
    successCondition: result[0] < 0.05
    failureLimit: 5
    provider:
      prometheus:
        address: http://prometheus-server:9090
        query: |
          rate(http_requests_total{service="{{args.service-name}}",status=~"5.."}[5m])
  - name: latency-p95
    interval: 60s
    successCondition: result[0] < 0.5
    failureLimit: 3
    provider:
      prometheus:
        address: http://prometheus-server:9090
        query: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service="{{args.service-name}}"}[5m]))
