{{- if .Values.minio.enabled }}
{{- $minio := .Values.minio }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "astrovoxai.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app: minio
    {{- include "astrovoxai.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: "{{ $minio.auth.rootUser }}"
  root-password: "{{ $minio.auth.rootPassword }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astrovoxai.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app: minio
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
      {{- include "astrovoxai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: minio
        {{- include "astrovoxai.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: minio
        image: "{{ $minio.image }}"
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "astrovoxai.fullname" . }}-minio
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "astrovoxai.fullname" . }}-minio
              key: root-password
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: api
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: {{ include "astrovoxai.fullname" . }}-minio
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astrovoxai.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    app: minio
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: minio
    {{- include "astrovoxai.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "astrovoxai.fullname" . }}-minio
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $minio.persistence.size | default "20Gi" }}
{{- end }}
