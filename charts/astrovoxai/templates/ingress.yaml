{{- if .Values.ingress.enabled }}
{{- $ingressEnabled := .Values.ingress.enabled }}
{{- $ingressClassEnabled := and .Values.ingress.className (not (empty .Values.ingress.className)) }}
{{- if or $ingressEnabled $ingressClassEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astrovoxai.fullname" . }}-backend
  labels:
    {{- include "astrovoxai.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      pathType: Prefix
      paths:
        {{- range .paths }}
        - path: {{ .path }}
          pathType: {{ .pathType }}
          backend:
            service:
              name: {{ include "astrovoxai.fullname" $ }}-backend
              port:
                number: {{ $.Values.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.frontend.ingress.enabled }}
{{- $frontendIngressEnabled := .Values.frontend.ingress.enabled }}
{{- $frontendIngressClassEnabled := and .Values.frontend.ingress.className (not (empty .Values.frontend.ingress.className)) }}
{{- if or $frontendIngressEnabled $frontendIngressClassEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "astrovoxai.fullname" . }}-frontend
  labels:
    {{- include "astrovoxai.labels" . | nindent 4 }}
  {{- with .Values.frontend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.frontend.ingress.className }}
  ingressClassName: {{ .Values.frontend.ingress.className }}
  {{- end }}
  {{- if .Values.frontend.ingress.tls }}
  tls:
    {{- toYaml .Values.frontend.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.frontend.ingress.hosts }}
    - host: {{ .host }}
      pathType: Prefix
      paths:
        {{- range .paths }}
        - path: {{ .path }}
          pathType: {{ .pathType }}
          backend:
            service:
              name: {{ include "astrovoxai.fullname" $ }}-frontend
              port:
                number: {{ $.Values.frontend.service.port }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}