apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astrovoxai.fullname" . }}-kong
  namespace: {{ .Release.Namespace }}
  labels:
    app: kong
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kong
      {{- include "astrovoxai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: kong
        {{- include "astrovoxai.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: kong
        image: "{{ .Values.image.registry }}/kong:3.5"
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000"
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "2"
        ports:
        - containerPort: 8000
          name: proxy
          protocol: TCP
        - containerPort: 8443
          name: proxy-tls
          protocol: TCP
        - containerPort: 8001
          name: admin
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astrovoxai.fullname" . }}-kong-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: kong
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    name: proxy
  - port: 443
    targetPort: 8443
    name: proxy-tls
  selector:
    app: kong
    {{- include "astrovoxai.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astrovoxai.fullname" . }}-kong-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app: kong
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    name: admin
  selector:
    app: kong
    {{- include "astrovoxai.selectorLabels" . | nindent 4 }}
---
{{- range $plugin := .Values.astrovoxai.kong.plugins }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $plugin.name }}
  namespace: {{ $.Release.Namespace }}
config:
  {{- toYaml $plugin.config | nindent 2 }}
{{- end }}
