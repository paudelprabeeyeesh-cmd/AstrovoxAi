apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astrovoxai.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      {{- include "astrovoxai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: redis
        {{- include "astrovoxai.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: redis
        image: "{{ .Values.image.registry }}/redis:7-alpine"
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          value: "{{ .Values.redis.password }}"
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis
          readOnly: true
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: redis-config
        configMap:
          name: {{ include "astrovoxai.fullname" . }}-redis-config
      - name: redis-data
        persistentVolumeClaim:
          claimName: {{ include "astrovoxai.fullname" . }}-redis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "astrovoxai.fullname" . }}-redis-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astrovoxai.labels" . | nindent 4 }}
data:
  redis.conf: |
    maxmemory 1gb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astrovoxai.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis
    {{- include "astrovoxai.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "astrovoxai.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "astrovoxai.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
