apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: astrovox-hpa
  namespace: astrovox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: astrovox-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
