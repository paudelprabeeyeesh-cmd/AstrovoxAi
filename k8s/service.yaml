apiVersion: v1
kind: Service
metadata:
  name: astrovox-backend
  namespace: astravox
spec:
  selector:
    app: astrovox-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: astrovox-frontend
  namespace: astravox
spec:
  selector:
    app: astrovox-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
