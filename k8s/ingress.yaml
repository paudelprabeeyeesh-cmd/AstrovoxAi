apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astrovox-ingress
  namespace: astrovox
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - astrovox.example.com
    secretName: astrovox-tls
  rules:
  - host: astrovox.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: astrovox-service
            port:
              number: 80
