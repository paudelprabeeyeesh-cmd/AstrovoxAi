apiVersion: v1
kind: ConfigMap
metadata:
  name: cdn-config
  namespace: astrovox
data:
  CDN_PROVIDER: cloudflare
  CDN_ZONE_ID: "your-cloudflare-zone-id"
  CDN_API_TOKEN: ""
  CDN_ENABLED: "true"
  CDN_CACHE_TTL: "86400"
  CDN_BROWSER_CACHE_TTL: "31536000"
  CDN_STATIC_EXTENSIONS: ".css,.js,.png,.jpg,.jpeg,.gif,.svg,.ico,.woff,.woff2,.ttf,.eot,.json,.xml"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astrovox-cdn-ingress
  namespace: astrovox
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://astrovox.ai"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  tls:
  - hosts:
    - astrovox.ai
    - cdn.astrovox.ai
    - api.astrovox.ai
    secretName: astrovox-tls
  rules:
  - host: astrovox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: astrovox-frontend
            port:
              number: 80
  - host: api.astrovox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: astrovox-backend
            port:
              number: 8000
  - host: cdn.astrovox.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: astrovox-frontend
  namespace: astrovox
spec:
  selector:
    app: astrovox-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: astrovox-backend
  namespace: astrovox
spec:
  selector:
    app: astrovox-backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
