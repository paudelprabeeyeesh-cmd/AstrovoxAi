apiVersion: v1
kind: Secret
metadata:
  name: astrovox-secrets
  namespace: astrovox
  annotations:
    sealed-secrets.bitnami.com/managed: "true"
    sealed-secrets.bitnami.com/cluster-wide: "false"
type: Opaque
immutable: true
# Real values must be injected via `kubectl create secret` or sealed-secrets.
# Do NOT commit plaintext credentials here.
stringData:
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  NEO4J_URI: ${NEO4J_URI}
  NEO4J_USER: ${NEO4J_USER}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  JAEGER_URL: ${JAEGER_URL}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  GOOGLE_GENERATIVEAI_API_KEY: ${GOOGLE_GENERATIVEAI_API_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
