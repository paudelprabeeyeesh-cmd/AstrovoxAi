apiVersion: v1
kind: Secret
metadata:
  name: astrovox-secrets
  namespace: astrovox
type: Opaque
stringData:
  DATABASE_URL: postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
  REDIS_URL: redis://redis-master:6379
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: neo4j_password
  JAEGER_URL: http://jaeger:14268/api/traces
  OPENAI_API_KEY: change-me
