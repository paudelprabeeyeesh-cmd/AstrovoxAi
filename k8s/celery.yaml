apiVersion: v1
kind: ConfigMap
metadata:
  name: celery-config
  namespace: astrovox
data:
  CELERY_BROKER_URL: redis://redis-master:6379/1
  CELERY_RESULT_BACKEND: redis://redis-master:6379/2
  CELERY_TASK_SERIALIZER: json
  CELERY_RESULT_SERIALIZER: json
  CELERY_ACCEPT_CONTENT: ["json"]
  CELERY_TIMEZONE: UTC
  CELERY_ENABLE_UTC: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: astrovox
  labels:
    app: celery-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: celery
        image: ghcr.io/astrovoxai/backend:latest
        command:
        - celery
        - -A
        - app.worker
        - worker
        - --loglevel=info
        - --concurrency=4
        envFrom:
        - configMapRef:
            name: astrovox-config
        - configMapRef:
            name: celery-config
        - secretRef:
            name: astrovox-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: celery-beat
  namespace: astrovox
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          containers:
          - name: celery-beat
            image: ghcr.io/astrovoxai/backend:latest
            command:
            - celery
            - -A
            - app.worker
            - beat
            - --loglevel=info
            envFrom:
            - configMapRef:
                name: astrovox-config
            - configMapRef:
                name: celery-config
            - secretRef:
                name: astrovox-secrets
          restartPolicy: OnFailure
