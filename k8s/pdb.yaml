apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: astrovox-backend-pdb
  namespace: astrovox
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: astrovox-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: astrovox-frontend-pdb
  namespace: astrovox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: astrovox-frontend
