apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrovox-app
  namespace: astrovox
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astrovox-app
  minReadySeconds: 10
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: astrovox-app
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: app
        image: astrovox:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: astrovox-config
        - secretRef:
            name: astrovox-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          periodSeconds: 10
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        lifecycle:
          preStop:
            httpGet:
              path: /health/prestop
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
