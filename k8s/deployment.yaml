apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrovox-backend
  namespace: astravox
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astrovox-backend
  template:
    metadata:
      labels:
        app: astrovox-backend
    spec:
      containers:
      - name: backend
        image: astrovox-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: astrovox-config
        - secretRef:
            name: astrovox-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrovox-frontend
  namespace: astravox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astrovox-frontend
  template:
    metadata:
      labels:
        app: astrovox-frontend
    spec:
      containers:
      - name: frontend
        image: astrovox-frontend:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: astrovox-config
        - secretRef:
            name: astrovox-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
