apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-phase-config
  namespace: astrovox
data:
  config.yaml: |
    phases:
      - phase: 36
        name: Monitoring Center
        metrics:
          - latency
          - throughput
          - error_rate
        alerts:
          - high_latency
          - error_spike
      - phase: 41
        name: AIOps
        alerts:
          - anomaly_detected
          - capacity_warning
      - phase: 56
        name: Performance Optimization
        profiling:
          - cpu
          - memory
          - io
    retention_days: "30"
    aggregation: "1m"
