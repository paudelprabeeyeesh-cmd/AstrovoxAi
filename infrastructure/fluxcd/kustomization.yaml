apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: astrovox
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/astrovox/astrovox.git
  ref:
    branch: main
  secretRef:
    name: astrovox-github-auth
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: astrovox
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: astrovox
  path: ./infrastructure/k8s
  prune: true
  validation: client
  timeout: 5m
  retryInterval: 1m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: astrovox-backend
      namespace: astrovox
    - apiVersion: apps/v1
      kind: Deployment
      name: astrovox-frontend
      namespace: astrovox
  dependsOn:
    - name: astrovox-infra
  postBuild:
    substitute:
      environment: production
      cluster: astrovox-production
