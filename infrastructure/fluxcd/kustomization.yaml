apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: astrovox
  namespace: flux-system
spec:
  interval: 30s
  url: https://github.com/astrovox/astrovox.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: astrovox
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: astrovox
  path: ./infrastructure/k8s
  prune: true
  validation: client
