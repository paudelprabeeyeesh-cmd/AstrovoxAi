apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-cache-rules
  namespace: cdn
data:
  cache_rules.json: |
    {
      "rules": [
        {
          "id": "static-assets",
          "action": "cache",
          "expression": "(http.request.uri.path matches \"^/static/(.*)\\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|json|xml)$\")",
          "cache": {
            "edge_ttl": {"mode": "override", "default": 31536000},
            "browser_ttl": {"mode": "override", "default": 31536000}
          }
        },
        {
          "id": "api-bypass",
          "action": "bypass",
          "expression": "(http.request.uri.path starts_with \"/api/\")",
          "cache": {"bypass": true}
        }
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cloudflare-cache-purge
  namespace: cdn
spec:
  template:
    spec:
      containers:
      - name: purge
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        env:
        - name: CLOUDFLARE_ZONE_ID
          valueFrom:
            configMapKeyRef:
              name: cloudflare-config
              key: CLOUDFLARE_ZONE_ID
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-secret
              key: CLOUDFLARE_API_TOKEN
      restartPolicy: Never
---
apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: cdn-cache-purge
  namespace: cdn
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: purge
            image: curlimages/curl:latest
            command:
            - sh
            - -c
            - |
              curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"purge_everything":true}'
            env:
            - name: CLOUDFLARE_ZONE_ID
              valueFrom:
                configMapKeyRef:
                  name: cloudflare-config
                  key: CLOUDFLARE_ZONE_ID
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-secret
                  key: CLOUDFLARE_API_TOKEN
          restartPolicy: OnFailure
