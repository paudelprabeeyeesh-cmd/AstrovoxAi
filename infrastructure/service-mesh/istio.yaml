apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: astrovox
  namespace: astrovox
spec:
  hosts:
    - astrovox.ai
  gateways:
    - astrovox-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: astrovox
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      timeout: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: astrovox
  namespace: astrovox
spec:
  host: astrovox
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h1UpgradePolicy: UPGRADE
        http2MaxRequests: 100
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
