"""Docker Compose staging configuration."""

version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
      target: staging
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=staging
      - DATABASE_URL=postgresql://astrovox:astrovox_pass@postgres:5432/astrovox_staging
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=astrovox
      - POSTGRES_PASSWORD=astrovox_pass
      - POSTGRES_DB=astrovox_staging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrovox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
