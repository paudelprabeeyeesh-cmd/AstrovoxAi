apiVersion: v1
kind: ConfigMap
metadata:
  name: production-readiness-config
  namespace: astrovox
data:
  config.yaml: |
    slos:
      - name: api_availability
        target: 99.9
        window: 30d
      - name: inference_latency_p99
        target: 200ms
        window: 7d
      - name: model_accuracy
        target: 0.95
        window: 30d
    chaos:
      - scenario: pod_failure
        frequency: weekly
      - scenario: network_partition
        frequency: monthly
      - scenario: database_failover
        frequency: quarterly
    runbooks:
      - incident_response
      - disaster_recovery
      - capacity_planning
