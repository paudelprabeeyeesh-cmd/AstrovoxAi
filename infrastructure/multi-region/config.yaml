apiVersion: v1
kind: Namespace
metadata:
  name: multi-region
  labels:
    multi-region: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: region-config
  namespace: multi-region
data:
  PRIMARY_REGION: us-east-1
  SECONDARY_REGIONS: us-west-2,eu-west-1,ap-southeast-1
  FAILOVER_TIMEOUT: "30"
  HEALTH_CHECK_INTERVAL: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: us-east-1-config
  namespace: multi-region
data:
  REGION_ID: us-east-1
  REGION_NAME: US East (N. Virginia)
  PRIORITY: "100"
  ENDPOINT: https://api-us-east-1.astrovox.ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: us-west-2-config
  namespace: multi-region
data:
  REGION_ID: us-west-2
  REGION_NAME: US West (Oregon)
  PRIORITY: "90"
  ENDPOINT: https://api-us-west-2.astrovox.ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eu-west-1-config
  namespace: multi-region
data:
  REGION_ID: eu-west-1
  REGION_NAME: EU (Ireland)
  PRIORITY: "80"
  ENDPOINT: https://api-eu-west-1.astrovox.ai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ap-southeast-1-config
  namespace: multi-region
data:
  REGION_ID: ap-southeast-1
  REGION_NAME: Asia Pacific (Singapore)
  PRIORITY: "70"
  ENDPOINT: https://api-ap-southeast-1.astrovox.ai
---
apiVersion: v1
kind: Service
metadata:
  name: multi-region-gateway
  namespace: multi-region
spec:
  type: ExternalName
  externalName: api.astrovox.ai
