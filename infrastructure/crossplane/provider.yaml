apiVersion: v1
kind: ConfigMap
metadata:
  name: crossplane-aws-provider
  namespace: crossplane-system
data:
  credentials: |
    [default]
    aws_access_key_id = ${AWS_ACCESS_KEY_ID}
    aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
    region = ${AWS_REGION}
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      name: crossplane-aws-provider
      namespace: crossplane-system
      key: credentials
