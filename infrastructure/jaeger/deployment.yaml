apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: observability
data:
  jaeger.yml: |
    metrics:
      prometheus:
        server-url: http://prometheus:9090
    storage:
      type: memory
    extensions:
      health_check:
    service:
      extensions: [health_check]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.50
          ports:
            - containerPort: 5778
            - containerPort: 16686
            - containerPort: 14268
            - containerPort: 14250
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config
