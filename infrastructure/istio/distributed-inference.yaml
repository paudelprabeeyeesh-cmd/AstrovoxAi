apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: distributed-inference-dr
  namespace: astrovox-distributed
spec:
  host: distributed-inference-gateway.astrovox-distributed.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        h1UpgradePolicy: UPGRADE
        http2MaxRequests: 100
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: distributed-inference-vs
  namespace: astrovox-distributed
spec:
  hosts:
    - distributed-inference-gateway.astrovox-distributed.svc.cluster.local
  http:
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: distributed-inference-gateway.astrovox-distributed.svc.cluster.local
            port:
              number: 8000
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      timeout: 30s
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: distributed-inference-sidecar
  namespace: astrovox-distributed
spec:
  workloadSelector:
    labels:
      app: distributed-inference
  ingress:
    - port:
        number: 8000
        name: http
        protocol: HTTP
  egress:
    - hosts:
        - ./*
