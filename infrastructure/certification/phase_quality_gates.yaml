apiVersion: v1
kind: ConfigMap
metadata:
  name: certification-quality-gates
  namespace: astrovox
data:
  gates.yaml: |
    phases:
      - phase: 31
        name: AI Governance
        checks:
          - policy_enforcement
          - audit_trail
          - risk_assessment
      - phase: 57
        name: Security Excellence
        checks:
          - zero_trust
          - penetration_test
          - vulnerability_scan
      - phase: 62
        name: Final Quality Certification
        checks:
          - iso27001
          - soc2
          - hipaa
          - gdpr
          - third_party_audit
    required_pass_rate: "0.95"
    auto_fail_on_critical: "true"
