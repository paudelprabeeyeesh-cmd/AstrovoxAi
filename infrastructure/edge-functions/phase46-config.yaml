apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-ai-config
  namespace: astrovox
data:
  devices.yaml: |
    platforms:
      - ios
      - android
      - raspberry-pi
      - jetson
    quantization:
      - int8
      - float16
    orchestration:
      - k3s
      - k8s-edge
    offline-first: "true"
    latency-target-ms: "50"
