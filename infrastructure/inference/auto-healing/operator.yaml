apiVersion: v1
kind: ConfigMap
metadata:
  name: auto-healing-config
  namespace: astrovox
data:
  CHECK_INTERVAL: "15s"
  MAX_RETRIES: "3"
  HEAL_ACTIONS: restart_pod,reschedule,scale_up,drain,replace
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-healer
  namespace: astrovox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auto-healer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "scale"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auto-healer
subjects:
  - kind: ServiceAccount
    name: auto-healer
    namespace: astrovox
roleRef:
  kind: ClusterRole
  name: auto-healer
  apiGroup: rbac.authorization.k8s.io
