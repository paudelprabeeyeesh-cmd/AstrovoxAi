apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: astrovox
  labels:
    app: jaeger
    component: distributed-tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        component: distributed-tracing
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          ports:
            - containerPort: 5775
              name: model-zipkin
            - containerPort: 16686
              name: ui
            - containerPort: 14268
              name: collector
            - containerPort: 14250
              name: grpc
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: astrovox
spec:
  ports:
    - port: 16686
      name: ui
      targetPort: 16686
    - port: 14268
      name: collector
      targetPort: 14268
  selector:
    app: jaeger
