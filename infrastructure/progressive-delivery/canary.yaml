apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: astrovox
  namespace: astrovox
spec:
  replicas: 3
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 1m}
        - setWeight: 25
        - pause: {duration: 2m}
        - setWeight: 50
        - pause: {duration: 2m}
        - setWeight: 75
        - pause: {duration: 1m}
        - setWeight: 100
      analysis:
        templates:
          - name: success-rate
            spec:
              successCondition: result[0] >= 0.95
              args:
                - name: service-name
                  value: astrovox
        args:
          - name: service-name
            value: astrovox
  selector:
    matchLabels:
      app: astrovox
  template:
    metadata:
      labels:
        app: astrovox
    spec:
      containers:
        - name: astrovox
          image: astrovox:latest
          ports:
            - containerPort: 8000
