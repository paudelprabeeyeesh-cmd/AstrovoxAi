apiVersion: v1
kind: ConfigMap
metadata:
  name: leader-election-config
  namespace: astrovox-distributed
data:
  HEARTBEAT_INTERVAL: "2"
  ELECTION_TIMEOUT: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leader-election
  namespace: astrovox-distributed
  labels:
    app: leader-election
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leader-election
  template:
    metadata:
      labels:
        app: leader-election
    spec:
      serviceAccountName: distributed-inference-sa
      containers:
        - name: leader-election
          image: astrovox/leader-election:latest
          ports:
            - containerPort: 4040
          envFrom:
            - configMapRef:
                name: leader-election-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4040
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: leader-election
  namespace: astrovox-distributed
spec:
  ports:
    - port: 4040
      targetPort: 4040
  selector:
    app: leader-election
