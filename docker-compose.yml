version: "3.8"

services:
  training:
    build:
      context: .
      dockerfile: Dockerfile.training
      target: production
    container_name: astrovox-training
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
    volumes:
      - ./models/llm/configs:/app/models/llm/configs:ro
      - ./models/llm/tokenizer.json:/app/models/llm/tokenizer.json:ro
      - ./training_data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    profiles:
      - training
      - dev
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    ipc: host
    shm_size: "8g"

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
      target: production
    container_name: astrovox-inference
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_CACHE=/app/models
      - LOG_LEVEL=info
    volumes:
      - ./models/llm/configs:/app/models/llm/configs:ro
      - ./models/llm/tokenizer.json:/app/models/llm/tokenizer.json:ro
      - ./model.pt:/app/model.pt:ro
      - ./logs:/app/logs
    profiles:
      - inference
      - dev
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    shm_size: "4g"

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.training
      target: production
    container_name: astrovox-benchmark
    command: python scripts/benchmark_inference.py --iterations 10
    volumes:
      - ./models/llm/configs:/app/models/llm/configs:ro
      - ./models/llm/tokenizer.json:/app/models/llm/tokenizer.json:ro
      - ./model.pt:/app/model.pt:ro
    profiles:
      - benchmark
      - dev
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

volumes:
  training-data:

networks:
  default:
    name: astrovox-dev-network
