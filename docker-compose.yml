version: "3.8"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ASTROVOX_DB=/data/astrovox.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/data
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
