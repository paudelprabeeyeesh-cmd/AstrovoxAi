services:
  astrovox:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        TARGETARCH: amd64
    image: astrovox/astrovox:1.0.0
    container_name: astrovox-engine
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP inference API
      - "9090:9090"   # metrics / dashboard
    environment:
      ASTROVOX_LOG_LEVEL: info
      ASTROVOX_WORKERS: "4"
      ASTROVOX_MAX_BATCH: "32"
      ASTROVOX_QUANT: none
      ASTROVOX_MODEL_DIR: /var/lib/astrovox/models
    volumes:
      - astrovox-models:/var/lib/astrovox/models
      - astrovox-checkpoints:/var/lib/astrovox/checkpoints
    healthcheck:
      test: ["CMD", "/usr/local/bin/astrovox", "doctor"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: monitoring stack for the observability package.
  monitor:
    image: astrovox/astrovox:1.0.0
    container_name: astrovox-monitor
    command: ["monitor", "--port", "9090"]
    restart: unless-stopped
    ports:
      - "9091:9090"
    depends_on:
      - astrovox

volumes:
  astrovox-models:
    driver: local
  astrovox-checkpoints:
    driver: local

networks:
  default:
    name: astrovox-net
