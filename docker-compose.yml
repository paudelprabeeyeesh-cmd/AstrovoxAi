version: '3.8'

services:
  # ==========================================================================
  # Redis — Caching, session store, rate limiting backend
  # ==========================================================================
  redis:
    image: redis:7-alpine@sha256:2c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-redis
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: host
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning
    restart: unless-stopped
    networks:
      - astrovox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    profiles:
      - default
      - dev
      - staging
      - prod
      - monitoring

  # ==========================================================================
  # PostgreSQL — Primary database
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16@sha256:3c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-postgres
    environment:
      POSTGRES_DB: astrovox
      POSTGRES_USER: astrovox
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrovox"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - astrovox-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - default
      - dev
      - staging
      - prod

  # ==========================================================================
  # FastAPI Backend
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: astrovox-backend
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - RATE_LIMIT=${RATE_LIMIT:-120/minute}
      - DAILY_AI_LIMIT=${DAILY_AI_LIMIT:-50}
    secrets:
      - db_password
      - openai_api_key
    restart: unless-stopped
    networks:
      - astrovox-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs
      - storage-data:/app/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M
    stop_grace_period: 60s
    profiles:
      - default
      - dev
      - staging
      - prod

  # ==========================================================================
  # React Frontend (served via nginx)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    container_name: astrovox-frontend
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - astrovox-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    profiles:
      - default
      - dev
      - staging
      - prod

  # ==========================================================================
  # Celery Worker — Background task processing
  # ==========================================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: astrovox-celery
    command: celery -A app.celery worker --loglevel=info --concurrency=4
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    secrets:
      - db_password
      - openai_api_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - astrovox-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    profiles:
      - ai-services
      - staging
      - prod

  # ==========================================================================
  # Celery Beat — Periodic task scheduler
  # ==========================================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: astrovox-celery-beat
    command: celery -A app.celery beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://astrovox:astrovox_pass@postgres:5432/astrovox
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    secrets:
      - db_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - ai-services
      - staging
      - prod

  # ==========================================================================
  # AI Services — LLM processing, embeddings, etc.
  # ==========================================================================
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    container_name: astrovox-ai-service
    command: uvicorn app.ai.main:app --host 0.0.0.0 --port 8001 --workers 2
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    secrets:
      - openai_api_key
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - astrovox-network
    ports:
      - target: 8001
        published: 8001
        protocol: tcp
        mode: host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    profiles:
      - ai-services
      - staging
      - prod

  # ==========================================================================
  # Prometheus — Metrics collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0@sha256:4c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-prometheus
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - monitoring

  # ==========================================================================
  # Grafana — Metrics visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.4.0@sha256:5c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-grafana
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.astrovox.ai
      - GF_SERVER_DOMAIN=astrovox.ai
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - astrovox-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ==========================================================================
  # Jaeger — Distributed tracing
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.53@sha256:6c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-jaeger
    ports:
      - target: 16686
        published: 16686
        protocol: tcp
        mode: host
      - target: 4317
        published: 4317
        protocol: tcp
        mode: host
      - target: 4318
        published: 4318
        protocol: tcp
        mode: host
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - METRICS_STORAGE_TYPE=prometheus
      - PROMETHEUS_SERVER_URL=http://prometheus:9090
    volumes:
      - jaeger-data:/var/lib/jaeger
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - monitoring
      - observability

  # ==========================================================================
  # Loki — Log aggregation
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.3@sha256:7c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-loki
    ports:
      - target: 3100
        published: 3100
        protocol: tcp
        mode: host
    volumes:
      - loki-data:/loki
      - ./monitoring/loki:/etc/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - monitoring
      - observability

  # ==========================================================================
  # Promtail — Log collection
  # ==========================================================================
  promtail:
    image: grafana/promtail:2.9.3@sha256:8c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - monitoring
      - observability

  # ==========================================================================
  # MinIO — S3-compatible object storage
  # ==========================================================================
  minio:
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z@sha256:9c3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-minio
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - storage
      - dev
      - staging
      - prod

  # ==========================================================================
  # Mailpit — Email testing for development/staging
  # ==========================================================================
  mailpit:
    image: axllent/mailpit:v1.8@sha256:ac3ec6c6f3c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5c5
    container_name: astrovox-mailpit
    ports:
      - target: 8025
        published: 8025
        protocol: tcp
        mode: host
      - target: 1025
        published: 1025
        protocol: tcp
        mode: host
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
    restart: unless-stopped
    networks:
      - astrovox-network
    profiles:
      - dev
      - staging

# ==============================================================================
# Networks
# ==============================================================================
networks:
  astrovox-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
  loki-data:
    driver: local
  minio-data:
    driver: local
  storage-data:
    driver: local

# ==============================================================================
# Secrets (Docker Swarm / Docker Compose secrets)
# ==============================================================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
