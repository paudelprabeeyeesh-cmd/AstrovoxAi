version: '3.8'

services:
  # ==========================================================================
  # Redis — Caching, session store, rate limiting backend
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: astravox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - astravox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # FastAPI Backend
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: astravox-backend
    ports:
      - "8000:8000"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - RATE_LIMIT=${RATE_LIMIT:-120/minute}
      - DAILY_AI_LIMIT=${DAILY_AI_LIMIT:-50}
    restart: unless-stopped
    networks:
      - astravox-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/app/logs
      - storage-data:/app/storage

  # ==========================================================================
  # React Frontend (served via nginx)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: astrovox-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - astravox-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ==========================================================================
  # Prometheus — Metrics collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: astravox-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - astravox-network
    profiles:
      - monitoring

  # ==========================================================================
  # Grafana — Metrics visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: astravox-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/astrovox.json:ro
    restart: unless-stopped
    networks:
      - astravox-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ==========================================================================
  # Loki — Log aggregation
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.3
    container_name: astravox-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - astravox-network
    profiles:
      - monitoring

  # ==========================================================================
  # Promtail — Log collection
  # ==========================================================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: astravox-promtail
    volumes:
      - ./logs:/var/log/astrovox
      - ./02-Backend/app/logs:/var/log/astrovox/backend:ro
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - astravox-network
    depends_on:
      - loki
    profiles:
      - monitoring

  # ==========================================================================
  # Jaeger — Distributed tracing
  # ==========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: astravox-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - METRICS_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    restart: unless-stopped
    networks:
      - astravox-network
    profiles:
      - monitoring

  # ==========================================================================
  # Alertmanager — Alert routing and notifications
  # ==========================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: astravox-alertmanager
    ports:
      - "9093:9093"
    environment:
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - PAGERDUTY_API_KEY=${PAGERDUTY_API_KEY:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - chmod +x /etc/alertmanager/entrypoint.sh && /etc/alertmanager/entrypoint.sh
    restart: unless-stopped
    networks:
      - astravox-network
    profiles:
      - monitoring

# ==============================================================================
# Networks
# ==============================================================================
networks:
  astravox-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local
  storage-data:
    driver: local
