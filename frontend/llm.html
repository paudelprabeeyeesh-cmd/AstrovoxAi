<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Chat — AstrovoxAI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>LLM Chat</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="training.html">Training</a>
      <a href="model-factory.html">Models</a>
    </nav>
  </header>
  <main class="container">
    <section class="card">
      <h2>Chat with LLM</h2>
      <div id="chat-output" style="border:1px solid var(--border);border-radius:0.5rem;padding:1rem;min-height:200px;max-height:400px;overflow-y:auto;margin-bottom:1rem;"></div>
      <input id="chat-input" type="text" placeholder="Type a message..." style="width:100%;padding:0.75rem;border-radius:0.5rem;border:1px solid var(--border);" />
      <button id="send-btn" style="margin-top:0.75rem;padding:0.5rem 1rem;border-radius:0.5rem;background:var(--accent);color:#fff;border:none;cursor:pointer;">Send</button>
    </section>

    <section class="card" style="margin-top:1.5rem;">
      <h2>Text Generation</h2>
      <label>Prompt</label>
      <textarea id="gen-prompt" rows="4" style="width:100%;padding:0.75rem;border-radius:0.5rem;border:1px solid var(--border);"></textarea>
      <label>Max Tokens</label>
      <input id="gen-tokens" type="number" value="200" min="1" max="1024" />
      <label>Temperature</label>
      <input id="gen-temp" type="number" value="0.8" min="0.1" max="2.0" step="0.1" />
      <button id="generate-btn" style="margin-top:0.75rem;padding:0.5rem 1rem;border-radius:0.5rem;background:var(--accent);color:#fff;border:none;cursor:pointer;">Generate</button>
      <pre id="gen-output" style="margin-top:1rem;"></pre>
    </section>
  </main>
  <script src="js/llm.js"></script>
</body>
</html>
