<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AstrovoxAI - Enterprise AI Infrastructure</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components/platform.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        const stored = localStorage.getItem('api_base');
        if (stored) {
          window.__API_BASE__ = stored;
          return;
        }
      } catch {}
      const host = window.location.host;
      if (host && host !== 'localhost:8000') {
        window.__API_BASE__ = 'http://' + host;
      } else {
        window.__API_BASE__ = 'http://localhost:8000';
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
  <script src="js/platform/index.js"></script>
  <script src="js/platform/accessibility.js"></script>
  <script src="js/platform/motion.js"></script>
  <script src="js/platform/theme.js"></script>
  <script src="js/platform/design-tokens.js"></script>
  <script src="js/platform/offline.js"></script>
  <script src="js/platform/sync.js"></script>
  <script src="js/platform/pwa.js"></script>
  <script src="js/platform/presence.js"></script>
  <script src="js/platform/widget-framework.js"></script>
  <script src="js/platform/performance.js"></script>
  <script src="js/platform/reality-bending.js"></script>
  <script src="js/integrations/markdown.js"></script>
  <script src="js/integrations/mermaid.js"></script>
  <script src="js/integrations/katex.js"></script>
  <script src="js/integrations/monaco.js"></script>
  <script src="js/ui/command-palette.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/tooltip.js"></script>
  <script src="js/ui/split-pane.js"></script>
  <script src="js/ui/global-search.js"></script>
  <script src="js/ui/code-executor.js"></script>
  <script src="js/ui/code-agent.js"></script>
  <script src="js/ui/multi-modal-input.js"></script>
  <script src="js/ui/rag-panel.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
