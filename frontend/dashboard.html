<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - AstrovoxAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components/platform.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <div class="logo">A</div>
        <span>AstrovoxAI</span>
      </a>
      <div class="navbar-nav">
        <button class="nav-link" onclick="window.location.href='/chat.html'">Chat</button>
        <button class="nav-link active">Dashboard</button>
        <button class="nav-link" onclick="window.location.href='/index.html'">Home</button>
      </div>
      <div class="nav-user">
        <span id="user-display" class="nav-user-name">Guest</span>
        <button id="logout-btn" class="nav-link" style="display:none;">Logout</button>
      </div>
    </nav>

    <main class="page-content">
      <div class="container">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
          <div>
            <h1 style="font-size:1.75rem;font-weight:700;">Analytics Dashboard</h1>
            <p style="color:var(--text-secondary);font-size:0.875rem;">Real-time platform metrics and insights</p>
          </div>
          <div style="display:flex;gap:0.75rem;align-items:center;">
            <select id="timeframe-select" class="form-select" style="padding:0.5rem 0.75rem;border-radius:0.5rem;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);">
              <option value="1">Last 24 hours</option>
              <option value="7" selected>Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
            <button id="refresh-dashboard" class="btn btn-primary" style="padding:0.5rem 1rem;border-radius:0.5rem;background:var(--accent);color:#fff;border:none;cursor:pointer;font-weight:500;">Refresh</button>
          </div>
        </div>

        <div id="dashboard-loading" style="display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--text-secondary);">
          <div class="spinner" style="width:2rem;height:2rem;border:3px solid var(--bg-tertiary);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;"></div>
          <span style="margin-left:0.75rem;">Loading analytics...</span>
        </div>
        <div id="dashboard-error" style="display:none;padding:1rem;background:rgba(239,68,68,0.1);border:1px solid var(--error);border-radius:0.5rem;color:var(--error);margin-bottom:1rem;"></div>

        <div id="stats-grid" style="display:none;" class="dashboard-grid"></div>

        <div id="charts-grid" style="display:none;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem;margin-top:1.5rem;"></div>

        <div id="detail-sections" style="display:none;margin-top:1.5rem;gap:1.5rem;display:flex;flex-direction:column;"></div>
      </div>
    </main>

    <div id="toast-container" class="toast-container"></div>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
  </div>
</body>
</html>
