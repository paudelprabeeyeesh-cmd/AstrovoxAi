[package]
name = "astrovox-tauri"
version = "1.0.0"
description = "Astrovox AI Desktop App"
authors = ["Astrovox Team"]
license = "MIT"
repository = "https://github.com/astrovox/astrovox"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
