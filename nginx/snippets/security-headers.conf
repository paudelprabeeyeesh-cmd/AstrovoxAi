# ============================================================================
# AstrovoxAI nginx security headers - shared by every location
# ============================================================================
# Included explicitly by each location block. nginx's add_header directives
# are inherited ONLY by locations that declare no add_header of their own, so
# the previous top-of-server block silently lost CSP, HSTS and the rest on
# any location that set Cache-Control. Including this file makes the
# inheritance behaviour irrelevant.
#
# CSP notes:
#   * No 'nonce-...' - nginx cannot inject a nonce into a built JS bundle.
#   * No 'unsafe-inline' in script-src. That keyword disables the main
#     protection CSP offers against XSS.
#   * style-src keeps 'unsafe-inline' because bundlers emit inline
#     style attributes; style injection is not the token-theft vector that
#     script injection is.
# ============================================================================

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Download-Options "noopen" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-DNS-Prefetch-Control "off" always;

# connect-src must allow the API origin and the Supabase project. object-src
# 'none' and base-uri 'self' block plugin/redirect based injection.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.openai.com https://api.anthropic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
