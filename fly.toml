# Fly.io configuration for AstrovoxAI
# Docs: https://fly.io/docs/reference/configuration/

app = "astrovox-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  RATE_LIMIT = "120/minute"
  DAILY_AI_LIMIT = "50"
  METRICS_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "60s"
    method = "GET"
    timeout = "10s"
    path = "/health/readiness"

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/metrics"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "storage_data"
  destination = "/app/storage"

[metrics]
  port = 9091
  path = "/metrics"
