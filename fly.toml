# Fly.io configuration for AstrovoxAI
# Docs: https://fly.io/docs/reference/configuration/

app = "astrovox-ai"
primary region = "iad"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  RATE_LIMIT = "120/minute"
  DAILY_AI_LIMIT = "50"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "storage_data"
  destination = "/app/storage"
