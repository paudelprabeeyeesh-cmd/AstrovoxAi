[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG001", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = [
    "\\.eggs",
    "\\.git",
    "\\.mypy_cache",
    "\\.tox",
    "\\.venv",
    "_build",
    "build",
    "dist",
    "tests/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x --tb=short --strict-markers --timeout=120"

[tool.coverage.run]
source = ["models", "phase1_train.py", "train_1b.py", "train_10b.py", "train_10b_master.py"]
omit = ["tests/*", "phase1_checkpoints/*", "logs/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
