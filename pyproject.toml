[tool.black]
line-length = 100
target-version = ["py314"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py314"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG001", "S101"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = [
    "\\.eggs",
    "\\.git",
    "\\.mypy_cache",
    "\\.tox",
    "\\.venv",
    "_build",
    "build",
    "dist",
    "tests/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x --tb=short --strict-markers --timeout=120"
markers = [
    "gpu: mark test as requiring CUDA GPU(s)",
    "distributed: mark test as requiring distributed setup",
    "integration: mark test as integration test",
]

[tool.coverage.run]
source = ["models", "phase1_train.py", "train_1b.py", "train_10b.py", "train_10b_master.py"]
omit = ["tests/*", "phase1_checkpoints/*", "logs/*"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 0

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".eggs", ".git", ".hg", ".mypy_cache", ".tox", ".venv", "_build", "build", "dist"]
skip_gitignore = true

[tool.pylint.master]
load-plugins = []

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-branches = 20
max-locals = 20
max-returns = 10
max-statements = 60
