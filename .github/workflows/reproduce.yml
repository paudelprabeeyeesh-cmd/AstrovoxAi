name: Phase J Reproducibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  REPRO_CONFIG: configs/versioned/config_phase1_v1.yaml

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Full Reproduction Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache PyTorch
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/huggingface
          key: ${{ runner.os }}-torch-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-torch-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.txt
          pip install pytest pyyaml

      - name: Verify versioned config integrity
        run: |
          python -c "
          import hashlib, json, yaml
          from pathlib import Path

          config_path = Path('${{ env.REPRO_CONFIG }}')
          assert config_path.exists(), f'Config missing: {config_path}'

          sha = hashlib.sha256()
          sha.update(config_path.read_bytes())
          config_hash = sha.hexdigest()

          manifest_path = Path('configs/versioned/manifest.json')
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}
          configs = manifest.get('configs', {})
          config_name = config_path.name

          if config_name in configs:
              expected_hash = configs[config_name].get('sha256', '')
              print(f'Config: {config_name}')
              print(f'Computed SHA256: {config_hash}')
              print(f'Expected SHA256: {expected_hash}')
              if expected_hash and expected_hash != config_hash:
                  print(f'ERROR: Hash mismatch for {config_name}')
                  exit(1)
              else:
                  print('Hash validation: PASSED (no expected hash in manifest or match)')
          else:
              print(f'WARNING: {config_name} not found in manifest')
          "

      - name: Run reproduction script
        run: |
          python scripts/reproduce.py --config ${{ env.REPRO_CONFIG }}

      - name: Upload reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-artifacts-${{ github.sha }}
          path: |
            repro_metrics.json
            repro_export/
            phase1_model.pt
            phase1_checkpoints/
            phase1_logs/
          retention-days: 30
          if: always()

      - name: Verify reproducibility
        run: |
          python scripts/verify_reproducibility.py \
            --metrics repro_metrics.json \
            --expected configs/versioned/manifest.json \
            --config ${{ env.REPRO_CONFIG }}

      - name: Post reproduction status
        if: always()
        run: |
          if [ -f repro_metrics.json ]; then
            echo "### Reproduction Metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python -c "
            import json
            m = json.load(open('repro_metrics.json'))
            print(f'| Metric | Value |')
            print(f'|--------|-------|')
            print(f'| Train rows | {m.get(\"train_rows\", \"N/A\")} |')
            print(f'| Val rows | {m.get(\"val_rows\", \"N/A\")} |')
            print(f'| Final train loss | {m.get(\"final_train_loss\", \"N/A\")} |')
            print(f'| Val accuracy | {m.get(\"val_accuracy\", \"N/A\")} |')
            print(f'| Convergence passed | {m.get(\"convergence_passed\", \"N/A\")} |')
            print(f'| Reproducibility passed | {m.get(\"reproducibility_passed\", \"N/A\")} |')
            print(f'| Model SHA256 | {m.get(\"model_file_sha256\", \"N/A\")[:16]}... |')
            " >> $GITHUB_STEP_SUMMARY
          fi

  verify-on-pr:
    name: Verify on PR
    runs-on: ubuntu-latest
    needs: reproduce
    if: github.event_name == 'pull_request'
    steps:
      - name: Check reproducibility result
        run: |
          echo "Reproducibility check completed in 'reproduce' job."
