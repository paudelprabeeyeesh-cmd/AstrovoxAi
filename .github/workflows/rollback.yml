name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      target_version:
        description: 'Version/tag to rollback to (leave empty for previous version)'
        required: false
        default: ''
      reason:
        description: 'Reason for rollback'
        required: true
        default: 'Deployment issue'

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  get-previous-version:
    name: Get previous version
    runs-on: ubuntu-latest
    outputs:
      target_tag: ${{ steps.determine-tag.outputs.target_tag }}
      previous_tag: ${{ steps.determine-tag.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine rollback target
        id: determine-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.target_version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TARGET_TAG="$INPUT_TAG"
          else
            TARGET_TAG=$(git tag --sort=-version:refname | head -1)
          fi
          PREVIOUS_TAG=$(git tag --sort=-version:refname | sed -n '2p')

          echo "Target tag: $TARGET_TAG"
          echo "Previous tag: $PREVIOUS_TAG"

          echo "target_tag=$TARGET_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

  rollback-staging:
    name: Rollback staging
    runs-on: ubuntu-latest
    needs: get-previous-version
    if: ${{ github.event.inputs.environment == 'staging' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Rollback staging deployment
        run: |
          TARGET_TAG="${{ needs.get-previous-version.outputs.target_tag }}"
          echo "Rolling back staging to $TARGET_TAG"
          echo "Reason: ${{ github.event.inputs.reason }}"

          # Example for Fly.io staging
          # flyctl deploy --config fly.toml --app astrovox-staging --image astrovoxai/backend:$TARGET_TAG

          # Example for Render staging
          # curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" \
          #   -H "Content-Type: application/json" \
          #   -d "{\"version\":\"$TARGET_TAG\",\"reason\":\"${{ github.event.inputs.reason }}\"}"

          # Example for Kubernetes staging
          # kubectl set image deployment/backend backend=astrovoxai/backend:$TARGET_TAG -n staging
          # kubectl rollout status deployment/backend -n staging

          echo "Staging rollback to $TARGET_TAG initiated"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests after rollback..."
          echo "Staging smoke tests completed"

      - name: Notify team
        if: always()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔄 Staging rolled back to ${{ needs.get-previous-version.outputs.target_tag }}\nReason: ${{ github.event.inputs.reason }}\"}" || true

  rollback-production:
    name: Rollback production
    runs-on: ubuntu-latest
    needs: get-previous-version
    if: ${{ github.event.inputs.environment == 'production' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify rollback approval
        if: github.event.inputs.environment == 'production'
        run: |
          echo "⚠️ Production rollback requires manual approval"
          echo "This workflow should be protected by GitHub environment protection rules"

      - name: Rollback production deployment
        run: |
          TARGET_TAG="${{ needs.get-previous-version.outputs.target_tag }}"
          echo "Rolling back production to $TARGET_TAG"
          echo "Reason: ${{ github.event.inputs.reason }}"

          # Example for ECS Blue-Green
          # aws ecs update-service \
          #   --cluster astrovox-production \
          #   --service astrovox-backend \
          #   --force-new-deployment \
          #   --task-definition astrovox-backend:$TARGET_TAG

          # Example for Kubernetes production
          # kubectl set image deployment/backend backend=astrovoxai/backend:$TARGET_TAG -n production
          # kubectl rollout status deployment/backend -n production --timeout=600s

          echo "Production rollback to $TARGET_TAG initiated"

      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."
          echo "Production smoke tests completed"

      - name: Verify rollback
        if: always()
        run: |
          echo "Verifying production rollback..."
          curl -f https://api.astrovox.ai/health || exit 1
          echo "Production rollback verified"

      - name: Notify team
        if: always()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 Production rolled back to ${{ needs.get-previous-version.outputs.target_tag }}\nReason: ${{ github.event.inputs.reason }}\nAction: Verify service health and investigate root cause.\"}" || true

  create-rollback-issue:
    name: Create rollback incident issue
    runs-on: ubuntu-latest
    needs: [rollback-staging, rollback-production]
    if: always() && (needs.rollback-staging.result == 'failure' || needs.rollback-production.result == 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Create rollback incident issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[ROLLBACK] ${github.event.inputs.environment} rolled back to ${{ needs.get-previous-version.outputs.target_tag }}`;
            const body = `## Rollback Details

**Environment**: ${github.event.inputs.environment}
**Target Version**: ${{ needs.get-previous-version.outputs.target_tag }}
**Previous Version**: ${{ needs.get-previous-version.outputs.previous_tag }}
**Reason**: ${github.event.inputs.reason}
**Triggered by**: @${github.actor}
**Triggered at**: ${new Date().toISOString()}

## Next Steps

1. Investigate the root cause of the failed deployment
2. Review logs from the failed deployment
3. Fix the issue in the code
4. Re-deploy the fixed version

## Related Links

- [Deployment Logs](${github.server_url}/${github.repository}/actions)
- [Workflow Run](${github.server_url}/${github.repository}/actions/runs/${github.run_id})
`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['incident', 'rollback', 'blocked']
            });
