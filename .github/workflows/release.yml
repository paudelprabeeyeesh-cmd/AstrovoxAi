name: Release Pipeline

on:
  push:
    tags:
      - 'v*'  # Push events to matching v*, i.e. v1.0, v2.0.1

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to create GitHub releases
      packages: write  # Needed if you're publishing to GitHub Packages
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog generation
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - name: Install dependencies
        run: |
          # Install backend dependencies
          cd 02-Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Install frontend dependencies
          cd ..
          npm ci
      
      - name: Run tests
        run: |
          # Backend tests
          cd 02-Backend
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml
          
          # Frontend tests
          cd ..
          npm run test -- --ci --coverage
      
      - name: Build backend Docker image
        run: |
          cd 02-Backend
          docker build -f Dockerfile.backend -t astrovoxai/backend:${{ github.ref_name }} .
      
      - name: Build frontend Docker image
        run: |
          docker build -f Dockerfile.frontend -t astrovoxai/frontend:${{ github.ref_name }} .
      
      - name: Create release tarball
        run: |
          # Create version directory
          VERSION=${{ github.ref_name }}
          mkdir -p astrovoxai-release-$VERSION
          
          # Copy backend
          cp -r 02-Backend astrovoxai-release-$VERSION/
          
          # Copy frontend
          cp -r package.json package-lock.json astrovoxai-release-$VERSION/
          cp -r astrovoxai-frontend astrovoxai-release-$VERSION/
          
          # Copy documentation
          cp -r README.md DEPLOYMENT.md API.md AUDIT_REPORT.md astrovoxai-release-$VERSION/ 2>/dev/null || true
          
          # Create tarball
          tar -czvf astrovoxai-${{ github.ref_name }}.tar.gz astrovoxai-release-$VERSION
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./astrovoxai-${{ github.ref_name }}.tar.gz
          asset_name: astrovoxai-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload Docker images to Docker Hub (optional)
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag astrovoxai/backend:${{ github.ref_name }} ${{ secrets.DOCKER_USERNAME }}/astrovoxai-backend:${{ github.ref_name }}
          docker tag astrovoxai/frontend:${{ github.ref_name }} ${{ secrets.DOCKER_USERNAME }}/astrovoxai-frontend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/astrovoxai-backend:${{ github.ref_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/astrovoxai-frontend:${{ github.ref_name }}
      
      - name: Upload Docker images to GitHub Packages (optional)
        if: secrets.GITHUB_TOKEN != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag astrovoxai/backend:${{ github.ref_name }} ghcr.io/${{ github.repository_owner }}/astrovoxai-backend:${{ github.ref_name }}
          docker tag astrovoxai/frontend:${{ github.ref_name }} ghcr.io/${{ github.repository_owner }}/astrovoxai-frontend:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/astrovoxai-backend:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/astrovoxai-frontend:${{ github.ref_name }}

  # Optional: Nightly build for develop branch
  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 2 * * *'  # Every day at 2 AM UTC
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install dependencies
        run: |
          cd 02-Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd ..
          npm ci
      
      - name: Run tests
        run: |
          cd 02-Backend
          python -m pytest tests/ -x --tb=short
          cd ..
          npm run test -- --ci
      
      - name: Build nightly Docker images
        run: |
          cd 02-Backend
          docker build -f Dockerfile.backend -t astrovoxai/backend:nightly-${{ github.sha }} .
          docker build -f Dockerfile.frontend -t astrovoxai/frontend:nightly-${{ github.sha }} .
      
      - name: Push nightly images (if credentials available)
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push astrovoxai/backend:nightly-${{ github.sha }}
          docker push astrovoxai/frontend:nightly-${{ github.sha }}