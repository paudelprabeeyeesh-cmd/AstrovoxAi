name: Hardened Security

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to fail on'
        required: true
        default: 'HIGH'
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: read

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: ${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}
          ignore-unfixed: true
          scanners: 'vuln,secret,config,license'
          cache-dir: /tmp/trivy-cache
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif

  trivy-config:
    name: Trivy Kubernetes Config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'kube'
          scan-ref: 'k8s/'
          format: 'sarif'
          output: 'trivy-kube.sarif'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          hide-progress: true
      - name: Upload Trivy Kube SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-kube.sarif

  trivy-image:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/${{ github.repository }}-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          vuln-type: 'os,library'
          ignore-unfixed: true
      - name: Upload Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Scan for unencrypted secrets
        run: |
          if [ -f .env ]; then
            echo "WARNING: .env file found. Ensure it is gitignored."
            gitleaks detect --source=.env --report-path=gitleaks-env-report.sarif --report-format=sarif || true
          fi

  syft-sbom:
    name: Syft SBOM Generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      sbom-path: ${{ steps.sbom.outputs.sbom-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: spdx-json
          output: sbom.spdx.json
          ignore-unfixed: true
      - name: Upload SBOM
        id: sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

  grype-vuln-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    needs: syft-sbom
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-artifacts/
      - uses: aquasecurity/grype-action@master
        with:
          sbom: sbom-artifacts/sbom.spdx.json
          format: sarif
          output: grype-results.sarif
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          fail-on-severity: ${{ github.event.inputs.severity || 'HIGH' }}
          ignore-unfixed: true
      - name: Upload Grype SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      dependency-graph: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-git-modifications: true
          allow-dependencies-autoupdate: true
          base-ref: ${{ github.base_ref }}
          head-ref: ${{ github.head_ref }}
          config-file: .github/dependency-review-config.yml

  cosign-verify:
    name: Cosign Image Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@v3
      - name: Verify Backend Image Signature
        id: verify-backend
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          if cosign verify \
            --key cosign.pub \
            --output syft-text \
            "$IMAGE" 2>/dev/null; then
            echo "Backend image verified"
          else
            echo "WARNING: Backend image not yet signed or cosign key not configured"
          fi
      - name: Verify Frontend Image Signature
        id: verify-frontend
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE=ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          if cosign verify \
            --key cosign.pub \
            --output syft-text \
            "$IMAGE" 2>/dev/null; then
            echo "Frontend image verified"
          else
            echo "WARNING: Frontend image not yet signed or cosign key not configured"
          fi

  license-compliance:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci --ignore-scripts
      - run: pip install pip-licenses --quiet
      - name: Check Python Licenses
        run: pip-licenses --fail-on="${{ secrets.LICENSE_DENYLIST || 'AGPL,GPL' }}"
      - name: Check npm License
        run: |
          npm ls --all --omit=dev 2>/dev/null | grep -E 'AGPL|GPL' || true
      - name: Upload License Manifest
        uses: actions/upload-artifact@v4
        with:
          name: license-manifest
          path: |
            licenses/
            pip-licenses-output.txt
          retention-days: 30

  frontend-secret-audit:
    name: Frontend Build Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on privileged keys in frontend source
        run: |
          set -u
          echo "Auditing src/ and vite.config.ts for privileged credentials."
          # A VITE_ variable is inlined into the browser bundle at build
          # time, so a privileged key placed in one is published to every
          # visitor. These patterns are the high-confidence shapes.
          BAD='service_role|SUPABASE_SERVICE|sk_live_[A-Za-z0-9]{16,}|sk-ant-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN .*PRIVATE KEY-----|VITE_[A-Z0-9_]*(SERVICE_ROLE|SECRET|PRIVATE)[A-Z0-9_]*\s*=\s*\S{8,}'

          hits=$(grep -rInE "$BAD" src vite.config.ts index.html 2>/dev/null | grep -v '^\s*//' || true)
          if [ -n "$hits" ]; then
            echo "::error::Privileged credential pattern found in frontend source:"
            echo "$hits" | sed 's/[A-Za-z0-9_-]\{40,\}/<redacted>/g'
            exit 1
          fi
          echo "No privileged credential patterns in frontend source."

      - name: Confirm only public VITE_ variables are referenced
        run: |
          echo "VITE_ variables referenced by the frontend (all must be public):"
          grep -rhoE 'import\.meta\.env\.VITE_[A-Z0-9_]+' src 2>/dev/null | sort -u || true
          offenders=$(grep -rInE 'import\.meta\.env\.VITE_[A-Z0-9_]*(SECRET|SERVICE_ROLE|PRIVATE)[A-Z0-9_]*' src 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::A privileged VITE_ variable is read by frontend code:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: no privileged VITE_ variable is read by frontend code."

  compose-smoke:
    name: Production Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the prod compose file parses
        run: docker compose -f docker-compose.prod.yml config -q

      - name: Boot the prod stack with test secrets
        run: |
          cat > .env.ci <<'EOF'
          SECRET_KEY=ci-only-not-a-real-secret
          JWT_SECRET_KEY=ci-only-not-a-real-secret
          REDIS_PASSWORD=ci-redis-password
          GRAFANA_PASSWORD=ci-grafana-password
          GF_SECURITY_ADMIN_PASSWORD=ci-grafana-password
          OPENAI_API_KEY=ci-placeholder
          ANTHROPIC_API_KEY=ci-placeholder
          ALLOWED_ORIGINS=http://localhost:5173
          EOF
          # The stack must actually start; a compose file that only lints is
          # not proof that the app can reach its dependencies.
          docker compose -f docker-compose.prod.yml --env-file .env.ci \
            up -d --wait --wait-timeout 120 redis postgres

          echo "--- service states ---"
          docker compose -f docker-compose.prod.yml ps

      # The concrete regression this guards: REDIS_URL had to carry
      # ${REDIS_PASSWORD}. redis-server was started with --requirepass, so a
      # passwordless URL got NOAUTH on every cache, session and rate-limit
      # call and the production stack could not use Redis at all. This proves
      # the client URL authenticates against the real server.
      - name: Assert the backend Redis URL authenticates
        run: |
          REDIS_URL=$(grep -E '^\s*-\s*REDIS_URL=' docker-compose.prod.yml | head -1 | sed 's/.*REDIS_URL=//')
          REDIS_URL=$(echo "$REDIS_URL" | sed 's|://redis:6379/0|://redis:6379/0|')
          # Resolve the placeholder against the same secret compose uses.
          REDIS_PASSWORD=$(grep -E '^REDIS_PASSWORD=' .env.ci | cut -d= -f2-)
          RESOLVED=$(echo "$REDIS_URL" | sed "s|\${REDIS_PASSWORD}|${REDIS_PASSWORD}|g")
          echo "Authenticating as: ${RESOLVED%%:*}//<redacted>@redis:6379/0"

          # AUTH succeeds only if the password matches --requirepass.
          docker compose -f docker-compose.prod.yml exec -T \
            redis redis-cli -a "${REDIS_PASSWORD}" \
            --no-auth-warning ping | grep -q PONG \
              && echo "Redis AUTH succeeded with the configured password"
          test -n "$(echo "$RESOLVED" | sed -n 's|.*://:\(.*\)@.*|\1|p')" \
              && echo "Redis URL carries a password" \
              || { echo "::error::REDIS_URL has no password; prod cannot reach Redis"; exit 1; }

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.ci \
            down -v --remove-orphans || true

  coverage-enforcement:
    name: Coverage Enforcement
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-results-backend-3.12
          path: coverage-artifacts/
      - name: Enforce minimum coverage
        run: |
          COVERAGE_THRESHOLD=80
          python - .coverage-reports/ <<'PY'
          """Fail the build when real, measured coverage is below the threshold.

          The previous version compared the threshold constant to itself
          (``80 >= 75``), which always exited 0. A gate that always passes
          is worse than no gate: it looks like a control in CI logs while
          enforcing nothing. This reads the coverage XML that the test job
          produced and parses the actual line-rate from it.
          """
          import os
          import sys
          import xml.etree.ElementTree as ET

          threshold = float(os.environ.get("COVERAGE_THRESHOLD", "80"))
          root = sys.argv[1] if len(sys.argv) > 1 else "."

          xml_files = []
          for dirpath, _dirs, files in os.walk(root):
              for name in files:
                  if name in ("coverage.xml", "coverage-backend.xml"):
                      xml_files.append(os.path.join(dirpath, name))

          if not xml_files:
              print(f"::error::No coverage XML found under {root}; "
                    "cannot enforce the coverage gate.")
              sys.exit(1)

          total_lines = 0
          covered_lines = 0
          per_file = {}

          for path in sorted(xml_files):
              try:
                  tree = ET.parse(path)
              except ET.ParseError as exc:
                  print(f"::error::Unparseable coverage XML {path}: {exc}")
                  sys.exit(1)
              for cls in tree.getroot().iter("class"):
                  for line in cls.iter("line"):
                      total_lines += 1
                      if line.get("hits", "0").strip() not in ("0", "", "None"):
                          covered_lines += 1

          if total_lines == 0:
              print("::error::Coverage XML contains no line elements; "
                    "the gate cannot be satisfied by empty data.")
              sys.exit(1)

          pct = 100.0 * covered_lines / total_lines
          print(f"Measured coverage: {pct:.2f}% "
                f"({covered_lines}/{total_lines} lines, threshold {threshold}%)")

          if pct < threshold:
              print(f"::error::Coverage {pct:.2f}% is below the required "
                    f"{threshold}%.")
              sys.exit(1)

          print("Coverage gate passed.")
          PY

  security-aggregate:
    name: Security Aggregate
    needs:
      - trivy-fs
      - trivy-config
      - trivy-image
      - gitleaks
      - grype-vuln-scan
      - cosign-verify
      - dependency-review
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security Check Summary
        run: |
          echo "Security scanning complete."
          echo "Check GitHub Security tab for detailed alerts."
          echo "Trivy FS: ${{ needs.trivy-fs.result }}"
          echo "Trivy Config: ${{ needs.trivy-config.result }}"
          echo "Trivy Image: ${{ needs.trivy-image.result }}"
          echo "Gitleaks: ${{ needs.gitleaks.result }}"
          echo "Grype: ${{ needs.grype-vuln-scan.result }}"
          echo "Cosign Verify: ${{ needs.cosign-verify.result }}"
          echo "Dependency Review: ${{ needs.dependency-review.result }}"
