name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install isort ruff radon
          npm ci

      - name: Check import sorting (Python)
        run: isort --check-only --diff 02-Backend/app tools || echo "Import sorting issues found"

      - name: Check import sorting (TypeScript)
        run: npx import-sort-cli -l error src apps sdk tools || echo "Import sorting issues found"

      - name: Run code quality dashboard
        run: |
          mkdir -p code-quality-reports
          python tools/code-quality/dashboard.py || true

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-reports
          path: code-quality-reports/
          retention-days: 30

      - name: Run complexity analysis
        run: |
          pip install radon
          radon cc 02-Backend/app -a -s || echo "Complexity analysis completed"

      - name: Run maintainability index
        run: |
          radon mi 02-Backend/app -a -s || echo "Maintainability analysis completed"

      - name: Run security linting
        run: |
          python tools/code-quality/security-lint-rules.py || echo "Security lint completed"

      - name: Check for circular dependencies
        run: |
          python tools/code-quality/circular-deps-detector.py || echo "Circular dependency check completed"

  import-sorting:
    name: Import Sorting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install isort
        run: pip install isort

      - name: Check Python imports
        run: isort --check-only --diff 02-Backend/app tools || echo "Python import issues found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript imports
        run: npx import-sort-cli -l error src apps sdk tools || echo "TS import issues found"
