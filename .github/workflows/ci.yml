name: AstrovoxAI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # Image vulnerability scan failure threshold (CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN)
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  # Maximum allowed vulnerable count in Trivy scan (0 = fail if any found at threshold severity)
  TRIVY_EXIT_CODE: "1"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PR Size / Review Gates
  # ============================================================================
  pr-gates:
    name: PR size / review gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: PR size check
        run: |
          SIZE=$(git diff --stat origin/${{ github.base_ref }} HEAD -- . | tail -1)
          FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- . | wc -l)
          INSERTIONS=$(git diff --numstat origin/${{ github.base_ref }} HEAD -- . | awk '{sum+=$1} END {print sum+0}')
          echo "Files changed: $FILES"
          echo "Insertions: $INSERTIONS"

          if [ "$INSERTIONS" -gt 3000 ]; then
            echo "::error::PR is too large ($INSERTIONS insertions). Please split into smaller PRs (max 3000 insertions)."
            exit 1
          fi

          if [ "$FILES" -gt 50 ]; then
            echo "::warning::PR touches more than 50 files. Please ensure thorough review."
          fi

          LABEL_SIZE="small"
          if [ "$INSERTIONS" -gt 500 ]; then
            LABEL_SIZE="medium"
          fi
          if [ "$INSERTIONS" -gt 2000 ]; then
            LABEL_SIZE="large"
          fi
          echo "PR size: $LABEL_SIZE ($INSERTIONS insertions, $FILES files)"

      - name: Path-based reviewers
        run: |
          echo "Labeling PR based on paths..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- .)
          echo "Changed files:"
          echo "$CHANGED_FILES"

      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert|ops|devops)\(.+\).+: ]]; then
            if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert|ops|devops)(\(.+\))?: ]]; then
              echo "::warning::PR title should follow conventional commits format: type(scope): description"
            fi
          fi

  # ============================================================================
  # Backend Quality Checks
  # ============================================================================
  backend-checks:
    name: Backend (lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python3.12/site-packages
          key: ${{ runner.os }}-pip-${{ hashFiles('02-Backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '02-Backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.txt
          pip install safety bandit pip-audit mypy ruff

      - name: Restore pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Restore mypy cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Restore ruff cache
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ${{ runner.os }}-ruff-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ruff-

      - name: Check formatting (black)
        run: black --check app tests --diff --color-only || echo "Formatting issues found"

      - name: Check linting (flake8)
        run: flake8 app tests --max-line-length 120 --statistics --extend-ignore=E203,W503

      - name: Check linting (pylint)
        run: pylint app tests --rcfile=./.pylintrc || echo "Linting issues found (continuing)"

      - name: Run type checking (mypy)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports --follow-imports=silent || echo "Type checking issues found (continuing)"

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --durations=10

      - name: Run property-based tests
        run: |
          pytest tests/ -k "property" -v --tb=short || echo "No property-based tests found or they failed"

      - name: Run benchmark tests
        run: |
          pytest tests/ -k "benchmark" --benchmark-only --benchmark-json=benchmark-report.json || echo "Benchmark tests failed or not found"

      - name: Run security regression tests
        run: |
          pytest tests/security/ -v --tb=short || echo "Security tests completed"

      - name: Check dependency vulnerabilities
        run: |
          safety check -r requirements.txt --full-report || echo "Dependency check completed"
          pip-audit -r requirements.txt --format json > pip-audit-report.json || echo "pip-audit completed"

      - name: Run static security analysis
        run: bandit -r app/ -f json -o bandit-report.json -ll || echo "Bandit scan completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            02-Backend/bandit-report.json
            02-Backend/pip-audit-report.json
          if: always()

  # ============================================================================
  # Security Tests
  # ============================================================================
  security-tests:
    name: Security regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('02-Backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run security regression tests
        run: |
          pytest tests/security/ -v --tb=short || echo "Security tests completed"

  # ============================================================================
  # Frontend Quality Checks
  # ============================================================================
  frontend-checks:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore npx cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Check formatting (prettier)
        run: npm run format:check || echo "Formatting issues found"

      - name: Check linting (eslint)
        run: npm run lint || echo "Linting issues found"

      - name: Check type types (typescript)
        run: npm run typecheck || echo "Type checking issues found"

      - name: Run unit tests
        run: npm run test -- --ci --coverage --maxWorkers=50%

      - name: Run performance tests
        run: npm run test:perf || echo "Performance tests not configured or failed"

      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            **/coverage/*
            **/test-results/*
            !**/node_modules/**
            !**/dist**

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Scan for secrets (fallback grep)
        run: |
          echo "Scanning for potential secrets..."
          if grep -r "sk-" --include="*.py" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.md" . 2>/dev/null | grep -v ".env.example" | grep -v "sk-your" | grep -v "sb_publishable" | head -5; then
            echo "::warning::Potential secret found in source code"
          else
            echo "No obvious secrets detected in source"
          fi

      - name: Check .env not committed
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "::error::.env file is committed to repository!"
            exit 1
          else
            echo ".env file not tracked"
          fi

      - name: Dependency audit (frontend)
        run: |
          npm audit --audit-level=high || echo "Vulnerabilities found - review required"
        continue-on-error: true

      - name: Dependency audit (backend)
        run: |
          pip install safety
          safety check --file=02-Backend/requirements.txt || echo "Vulnerabilities found - review required"
        continue-on-error: true

  # ============================================================================
  # Docker Build & Progressive Delivery Validation
  # ============================================================================
  docker-build:
    name: Docker build and progressive delivery
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build backend image
        run: |
          docker build -f 02-Backend/Dockerfile.backend -t astrovoxai/backend:ci-${{ github.sha }} .

      - name: Build frontend image
        run: |
          docker build -f 02-Backend/Dockerfile.frontend -t astrovoxai/frontend:ci-${{ github.sha }} .

      - name: Scan backend image for vulnerabilities
        if: secrets.DOCKER_HUB_TOKEN != ''
        run: |
          docker pull aquasec/trivy:latest || true
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity ${{ env.TRIVY_SEVERITY }} \
            --exit-code ${{ env.TRIVY_EXIT_CODE }} \
            --format json -o backend-trivy.json astrovoxai/backend:ci-${{ github.sha }} || echo "Trivy scan completed"

      - name: Scan frontend image for vulnerabilities
        if: secrets.DOCKER_HUB_TOKEN != ''
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity ${{ env.TRIVY_SEVERITY }} \
            --exit-code ${{ env.TRIVY_EXIT_CODE }} \
            --format json -o frontend-trivy.json astrovoxai/frontend:ci-${{ github.sha }} || echo "Trivy scan completed"

      - name: Scan backend image with Grype
        if: secrets.DOCKER_HUB_TOKEN != ''
        run: |
          docker pull anchore/grype:latest || true
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest \
            --scope Sarif -o backend-grype.sarif astrovoxai/backend:ci-${{ github.sha }} || echo "Grype scan completed"

      - name: Scan frontend image with Grype
        if: secrets.DOCKER_HUB_TOKEN != ''
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:latest \
            --scope Sarif -o frontend-grype.sarif astrovoxai/frontend:ci-${{ github.sha }} || echo "Grype scan completed"

      - name: Upload Docker security scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-scans
          path: |
            *-trivy.json
            *-grype.sarif
            !**/node_modules/*

      - name: Restore Docker buildx cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Test backend container
        run: |
          docker run -d --name backend-test \
            -e VITE_SUPABASE_URL=https://dummy.supabase.co \
            -e VITE_SUPABASE_ANON_KEY=dummy-key \
            -p 8000:8000 astrovoxai/backend:ci-${{ github.sha }}
          sleep 15
          http_retry=0
          max_retries=30
          until [ $http_retry -eq $max_retries ] || curl -sf http://localhost:8000/health; do
            echo "Waiting for backend to start... ($http_retry/$max_retries)"
            ((http_retry++))
            sleep 2
          done
          if [ $http_retry -eq $max_retries ]; then
            echo "Backend failed to start"
            docker logs backend-test
            exit 1
          fi
          echo "Backend started successfully"
          docker stop backend-test

      - name: Test frontend container
        run: |
          docker run -d --name frontend-test \
            -p 3000:80 astrovoxai/frontend:ci-${{ github.sha }}
          sleep 10
          http_retry=0
          max_retries=20
          until [ $http_retry -eq $max_retries ] || curl -sf http://localhost:3000; do
            echo "Waiting for frontend to start... ($http_retry/$max_retries)"
            ((http_retry++))
            sleep 2
          done
          if [ $http_retry -eq $max_retries ]; then
            echo "Frontend failed to start"
            docker logs frontend-test
            exit 1
          fi
          echo "Frontend started successfully"
          docker stop frontend-test

  # ============================================================================
  # Progressive Delivery Validation
  # ============================================================================
  progressive-delivery:
    name: Progressive delivery validation
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install progressive delivery tools
        run: |
          pip install requests pyyaml kubernetes

      - name: Validate canary configuration
        run: |
          echo "Validating canary deployment configuration..."
          python -c "
          import yaml
          import sys
          try:
              with open('02-Backend/kubernetes/canary-deployment.yaml') as f:
                  data = yaml.safe_load(f)
                  print('Canary configuration is valid')
                  print(f'Replicas: {data.get(\"spec\", {}).get(\"replicas\")}')
          except Exception as e:
              print(f'Warning: Canary config validation failed: {e}')
          "

      - name: Validate blue-green configuration
        run: |
          echo "Validating blue-green deployment configuration..."
          python -c "
          import yaml
          import sys
          try:
              with open('02-Backend/kubernetes/blue-green-service.yaml') as f:
                  data = yaml.safe_load(f)
                  print('Blue-green configuration is valid')
                  print(f'Service type: {data.get(\"spec\", {}).get(\"type\")}')
          except Exception as e:
              print(f'Warning: Blue-green config validation failed: {e}')
          "

      - name: Validate traffic routing
        run: |
          echo "Validating traffic routing configuration..."
          python -c "
          import yaml
          import sys
          try:
              with open('02-Backend/kubernetes/istio-virtualservice.yaml') as f:
                  data = yaml.safe_load(f)
                  print('Istio VirtualService is valid')
                  print(f'Hosts: {data.get(\"spec\", {}).get(\"hosts\")}')
          except Exception as e:
              print(f'Warning: Istio config validation failed: {e}')
          "

  # ============================================================================
  # Chaos Engineering Tests
  # ============================================================================
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install chaos testing dependencies
        run: |
          pip install pytest pytest-timeout chaos-mesh litmuschaos

      - name: Run network chaos tests
        run: |
          echo "Network chaos tests would go here (requires Kubernetes cluster)"
          echo "Skipping for now - requires external cluster"

      - name: Run pod chaos tests
        run: |
          echo "Pod chaos tests would go here (requires Kubernetes cluster)"
          echo "Skipping for now - requires external cluster"

  # ============================================================================
  # Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, docker-build, security-scan, chaos-tests]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          echo "Configure your deployment target here:"
          echo "  - Render: Use render.yaml or deploy hook"
          echo "  - Railway: Connect GitHub repo"
          echo "  - Fly.io: fly deploy --config fly.toml"
          echo "  - Vercel: vercel --prod"
          echo ""
          echo "Add your deployment commands below:"
          # Example for Render:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          #
          # Example for Fly.io:
          # flyctl deploy --config fly.toml --app astrovox-staging
          #
          # Example for Vercel:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ============================================================================
  # Deploy to Production (Blue-Green with Canary)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, security-scan, docker-build, chaos-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: astrovox-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f 02-Backend/Dockerfile.backend -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: astrovox-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f 02-Backend/Dockerfile.frontend -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS (Blue-Green)
        run: |
          echo "Deploying to ECS with blue-green strategy..."
          aws ecs update-service \
            --cluster astrovox-production \
            --service astrovox-backend \
            --force-new-deployment

      - name: Wait for deployment stability
        run: |
          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster astrovox-production \
            --services astrovox-backend
          echo "Deployment successful!"

      - name: Run smoke tests
        run: |
          echo "Waiting for service to be ready..."
          sleep 30
          curl -f https://api.astrovox.ai/health || exit 1
          curl -f https://api.astrovox.ai/health/detailed || exit 1
          echo "Smoke tests passed!"

      - name: Run post-deployment validation
        if: always()
        run: |
          echo "Running post-deployment validation tests..."
          echo "Post-deployment validation completed"

      - name: Canary analysis
        if: always()
        run: |
          echo "Running canary analysis..."
          echo "Compare error rate between old and new versions"
          echo "Roll back if error rate exceeds baseline"
