name: AstrovoxAI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend Checks
  # ============================================================================
  backend-checks:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 02-Backend/requirements.txt

      - name: Install dependencies
        working-directory: 02-Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting (black)
        working-directory: 02-Backend
        run: black --check app tests

      - name: Check linting (flake8)
        working-directory: 02-Backend
        run: flake8 app tests --max-line-length 120 --statistics

      - name: Run type checking (mypy)
        working-directory: 02-Backend
        run: |
          pip install mypy
          mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests with coverage
        working-directory: 02-Backend
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: 02-Backend/coverage.xml
          fail_ci_if_error: false

  # ============================================================================
  # Frontend Checks
  # ============================================================================
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: 02-Backend
        run: |
          pip install -r requirements.txt
          pip install safety bandit

      - name: Check dependency vulnerabilities
        working-directory: 02-Backend
        run: safety check -r requirements.txt
        continue-on-error: true

      - name: Run static security analysis
        working-directory: 02-Backend
        run: bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: 02-Backend/bandit-report.json

  # ============================================================================
  # Docker Build
  # ============================================================================
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t astrovox-backend:test .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t astrovox-frontend:test .

      - name: Test backend container
        run: |
          docker run -d --name backend-test \
            -e VITE_SUPABASE_URL=https://dummy.supabase.co \
            -e VITE_SUPABASE_ANON_KEY=dummy-key \
            -p 8000:8000 astrovox-backend:test
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop backend-test

  # ============================================================================
  # Deploy (Production)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, security-scan, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: astrovox-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.backend -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: astrovox-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.frontend -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster astrovox-production \
            --service astrovox-backend \
            --force-new-deployment

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster astrovox-production \
            --services astrovox-backend
          echo "Deployment successful!"

      - name: Run smoke tests
        run: |
          curl -f https://api.astrovox.ai/health
          echo "Smoke tests passed!"
