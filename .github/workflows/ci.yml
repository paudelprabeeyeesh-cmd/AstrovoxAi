name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  build-and-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration, race detector)
        run: go test -race -count=1 ./...

      - name: Test count gate
        run: |
          COUNT=$(go test ./... -v -count=1 2>/dev/null | grep -c '^=== RUN')
          echo "Total test functions: $COUNT"
          if [ "$COUNT" -lt 1000 ]; then
            echo "::error::test count $COUNT is below the 1000-function gate"
            exit 1
          fi

      - name: Race + stress
        run: go test -race -count=1 -timeout 30s ./internal/runtime ./internal/serving ./internal/distributed

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files: $unformatted"
            exit 1
          fi
      - name: go mod tidy check
        run: |
          cp go.mod /tmp/go.mod.bak
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.bak; then
            echo "::error::go.mod is not tidy"
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: astrovox/astrovox:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Simulate rollback-safe deploy
        run: |
          echo "Deploying ${{ github.sha }} to staging"
          echo "Health check: /healthz"
          echo "Rollback: keep previous image digest for instant revert"
