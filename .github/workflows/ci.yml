name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrovox
          POSTGRES_PASSWORD: astrovox
          POSTGRES_DB: astrovox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://astrovox:astrovox@localhost:5432/astrovox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install dependencies
        run: |
          cd 02-Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          cd 02-Backend
          python -m pytest tests/ -q
      
      - name: Run security scan
        run: |
          pip install bandit
          bandit -r 02-Backend/app -ll

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Install dependencies
        run: |
          cd 02-Backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run flake8
        run: |
          cd 02-Backend
          python -m flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 app/ --count --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check formatting with black
        run: |
          cd 02-Backend
          python -m black --check app/ tests/
      
      - name: Type check with mypy
        run: |
          cd 02-Backend
          python -m mypy app/ --ignore-missing-imports
        continue-on-error: true
