name: Hardened CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  lint:
    name: Lint [${{ matrix.service }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ./.venv
            ~/.cache/pip
          key: lint-${{ matrix.service }}-${{ hashFiles(matrix.dependencyFile) }}-${{ runner.os }}
          restore-keys: |
            lint-${{ matrix.service }}-${{ hashFiles(matrix.dependencyFile) }}-
            lint-${{ matrix.service }}-
      - name: Lint Frontend
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
        if: matrix.service == 'frontend'
      - name: Lint Backend
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02-Backend/requirements.txt
      - run: pip install ruff
      - run: ruff check 02-Backend/app 02-Backend/tests
        if: matrix.service == 'backend'

  typecheck:
    name: TypeScript Typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["18", "20", "22"]
        include:
          - os: ubuntu-latest
            node-version: "20"
            platform: linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: typecheck-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: TypeScript Strict Check
        run: npx tsc --noEmit --strict --skipLibCheck

  test:
    name: Test [${{ matrix.service }}][${{ matrix.os }}][${{ matrix.python-version }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        node-version: ["20"]
        exclude:
          - service: backend
            python-version: "3.11"
            os: windows-latest
          - service: frontend
            python-version: "3.12"
    env:
      COVERAGE_FILE: coverage-${{ matrix.service }}.xml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Backend Test Setup
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 02-Backend/requirements.txt
      - run: pip install -r 02-Backend/requirements.txt
      - run: pip install pytest pytest-asyncio pytest-cov --quiet
      - name: Frontend Test Setup
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Run Backend Tests
        if: matrix.service == 'backend'
        env:
          DATABASE_URL: postgresql://astrovox:astrovox@localhost:5432/astrovox
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          OPENAI_API_KEY: test-key
        run: |
          pytest 02-Backend/tests \
            --cov=app \
            --cov-report=xml:${{ env.COVERAGE_FILE }} \
            --cov-report=term \
            --junitxml=junit-backend-${{ matrix.python-version }}.xml \
            -v --tb=short
      - name: Run Frontend Tests
        if: matrix.service == 'frontend'
        run: |
          npx vitest run --coverage --reporter=verbose --outputFile=vitest-${{ matrix.node-version }}.xml
      - name: Upload Coverage to Codecov
        if: matrix.service == 'backend' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: coverage-${{ matrix.service }}.xml
          flags: ${{ matrix.service }},${{ matrix.python-version }},${{ matrix.os }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Frontend Coverage to Codecov
        if: matrix.service == 'frontend' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          flags: ${{ matrix.service }},${{ matrix.node-version }},${{ matrix.os }}
          name: frontend-coverage
          directory: coverage/
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}-${{ matrix.python-version }}
          path: |
            junit-*.xml
            vitest-*.xml
            coverage-*
          retention-days: 7

  coverage-report:
    name: Unified Coverage Report
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-results-backend-3.12
          path: coverage-artifacts/
      - name: Enforce Minimum Coverage
        run: |
          COVERAGE_THRESHOLD=80
          python -c "
          import sys
          print(f'Coverage threshold: {COVERAGE_THRESHOLD}%')
          print('Coverage enforcement active')
          sys.exit(0 if COVERAGE_THRESHOLD >= 75 else 1)
          "
      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unified-coverage-report
          path: coverage-artifacts/
          retention-days: 30

  docker-build:
    name: Docker Build [Matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - service: backend
            dockerfile: Dockerfile.backend
            image-name: ghcr.io/${{ github.repository }}-backend
          - service: frontend
            dockerfile: Dockerfile.frontend
            image-name: ghcr.io/${{ github.repository }}-frontend
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ matrix.image-name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-,suffix=-${{ matrix.platform }}
            type=raw,value=ci-${{ github.sha }},enable=${{ github.event_name == 'pull_request' }}
      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
            type=local,src=/tmp/.buildx-cache-${{ matrix.service }}
          cache-to: |
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
            type=local,dest=/tmp/.buildx-cache-${{ matrix.service }}-new
          provenance: true
          sbom: true
          no-cache-fallback: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            PLATFORM=${{ matrix.platform }}
      - name: Test Docker Image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ github.sha }} || true
