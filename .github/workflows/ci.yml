name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # Frontend: Lint + Typecheck + Build
  # ============================================================================
  frontend-checks:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -k dist/assets/*.js | awk '{print $1}')
          echo "Bundle size: ${BUNDLE_SIZE}kB"
          if [ "$BUNDLE_SIZE" -gt 500 ]; then
            echo "::warning::Bundle size exceeds 500kB threshold"
          fi

  # ============================================================================
  # Backend: Lint + Format + Test
  # ============================================================================
  backend-checks:
    name: Backend (lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('02-Backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check app tests

      - name: Check linting (flake8)
        run: flake8 app tests --max-line-length 120 --statistics

      - name: Run type checking (mypy)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  # ============================================================================
  # Docker Build Validation
  # ============================================================================
  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t astrovox-backend:test .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t astrovox-frontend:test .

      - name: Test backend image
        run: |
          docker run --rm -d --name test-backend \
            -e VITE_SUPABASE_URL=test \
            -e VITE_SUPABASE_ANON_KEY=test \
            -e OPENAI_API_KEY=test \
            astrovox-backend:test
          sleep 5
          docker ps | grep test-backend && echo "Backend container running" || echo "Backend container failed"
          docker stop test-backend || true

      - name: Test frontend image
        run: |
          docker run --rm -d --name test-frontend astrovox-frontend:test
          sleep 3
          docker ps | grep test-frontend && echo "Frontend container running" || echo "Frontend container failed"
          docker stop test-frontend || true

  # ============================================================================
  # Security: Secret Scanning
  # ============================================================================
  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          echo "Scanning for potential secrets..."
          # Check for common secret patterns (basic scan)
          if grep -r "sk-" --include="*.py" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" --include="*.md" . 2>/dev/null | grep -v ".env.example" | grep -v "sk-your" | grep -v "sb_publishable" | head -5; then
            echo "::warning::Potential secret found in source code"
          else
            echo "No obvious secrets detected in source"
          fi

      - name: Check .env not committed
        run: |
          if git ls-files | grep -q '\.env$'; then
            echo "::error::.env file is committed to repository!"
            exit 1
          else
            echo ".env file not tracked"
          fi

      - name: Dependency audit (frontend)
        run: |
          npm audit --audit-level=high || echo "Vulnerabilities found - review required"
        continue-on-error: true

      - name: Dependency audit (backend)
        run: |
          pip install safety
          safety check --file=02-Backend/requirements.txt || echo "Vulnerabilities found - review required"
        continue-on-error: true

  # ============================================================================
  # Deploy (on push to main only)
  # ============================================================================
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks, docker-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          echo "Configure your deployment target here:"
          echo "  - Render: Use render.yaml or deploy hook"
          echo "  - Railway: Connect GitHub repo"
          echo "  - Fly.io: fly deploy --config fly.toml"
          echo "  - Vercel: vercel --prod"
          echo ""
          echo "Add your deployment commands below:"
          # Example for Render:
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          #
          # Example for Fly.io:
          # flyctl deploy --config fly.toml --app astrovox-staging
          #
          # Example for Vercel:
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
