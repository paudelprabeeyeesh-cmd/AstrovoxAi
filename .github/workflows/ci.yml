name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check 02-Backend/app 02-Backend/tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy
        run: pip install mypy
      - name: Typecheck
        run: cd 02-Backend && mypy app --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: astrovox_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd 02-Backend
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: cd 02-Backend && python -m pytest tests/ -v --cov=app --cov-report=xml
      - name: Security scan with gitleaks
        run: |
          pip install gitleaks
          gitleaks detect --source=. --report-path=gitleaks-report.json
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./02-Backend/coverage.xml
          fail_ci_if_error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t astrovox-api .
