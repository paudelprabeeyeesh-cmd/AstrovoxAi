name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci --no-audit --no-fund

      - name: Compile
        # The manifest declares main: ./out/extension.js, so this step is what
        # makes that true. It used to fail: there was no tsconfig and no src/,
        # so `tsc -p ./` had nothing to compile and the published package
        # pointed at a file that did not exist.
        working-directory: extensions/vscode
        run: npm run compile

      - name: Lint
        working-directory: extensions/vscode
        run: npm run lint

      - name: Package a VSIX
        working-directory: extensions/vscode
        run: npx @vscode/vsce package --out astrovox-vscode.vsix --allow-missing-repository

      - name: The packaged extension contains its entry point
        # Verifies the packaged artifact rather than trusting the manifest:
        # an extension whose main is missing installs and does nothing, which
        # is invisible until it fails to activate.
        working-directory: extensions/vscode
        run: |
          python - <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile("astrovox-vscode.vsix") as z:
              manifest = json.loads(z.read("extension/package.json").decode("utf-8"))
              entry = "extension/" + manifest["main"].lstrip("./")
              missing = [n for n in (entry, "extension/package.json") if n not in z.namelist()]
          if missing:
              print("packaged extension is missing: %s" % missing)
              sys.exit(1)
          print("entry point present:", entry)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: astrovox-vscode
          path: extensions/vscode/astrovox-vscode.vsix
          if-no-files-found: error

  build-and-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration, race detector)
        run: go test -race -count=1 ./...

      - name: Test count gate
        run: |
          # The Go module is at the repository root, not in 02-Backend. This
          # gate previously ran `cd 02-Backend && go test`, which finds no Go
          # module and therefore always counted 0 - and since it piped to
          # 2>/dev/null, the failure was invisible and the gate could only
          # pass by accident. It is also run twice and the second result was
          # mislabelled "Go suite total" as if it were a different suite.
          COUNT=$(go test ./... -v -count=1 2>&1 | grep -c '^=== RUN')
          echo "Go test cases executed: $COUNT"
          if [ "$COUNT" -lt 1000 ]; then
            echo "::error::Go test count $COUNT is below the 1000-case gate"
            exit 1
          fi

      - name: Backend suite collects (D01-09 baseline)
        run: |
          cd 02-Backend
          python -m pytest tests --collect-only -q -p no:cacheprovider 2>&1 | tail -1

      - name: Cross-tenant isolation suite
        # The suite that catches a retrieval leak. Run explicitly as well as
        # by ./... so its failure names the suite in the CI log.
        run: go test -race -count=1 ./tests/isolation ./internal/retrieval

      - name: Retrieval and grounding evals
        # Required because a ranking change that nothing measures is a change
        # nobody can review. The measured numbers are in the CI log, and the
        # fixture fails if both retrieval paths score identically - which is
        # the state an eval is in when it has stopped measuring anything.
        run: go test -v -count=1 ./internal/evals ./internal/grounding

      - name: Race + stress
        run: go test -race -count=1 -timeout 30s ./internal/runtime ./internal/serving ./internal/distributed

      - name: "Import boundary (D01-11): product code must not import experiments"
        run: python tools/check_live_imports.py

      - name: Endpoint audit (auth on every mutating route)
        run: |
          cd 02-Backend
          python scripts/audit_privileged_endpoints.py

      - name: Coverage gate
        run: |
          cd 02-Backend
          COVERAGE_THRESHOLD=80 python -m pytest tests/security tests/integration tests/database \
            --cov=app --cov=app.database --cov=database --cov=sandboxing --cov=storage \
            --cov-report=xml:coverage-backend.xml -q --no-header -p no:cacheprovider --tb=short
          python .github/scripts/coverage_gate.py 80 coverage-backend.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files: $unformatted"
            exit 1
          fi
      - name: go mod tidy check
        run: |
          cp go.mod /tmp/go.mod.bak
          go mod tidy
          if ! diff -q go.mod /tmp/go.mod.bak; then
            echo "::error::go.mod is not tidy"
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: astrovox/astrovox:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Simulate rollback-safe deploy
        run: |
          echo "Deploying ${{ github.sha }} to staging"
          echo "Health check: /healthz"
          echo "Rollback: keep previous image digest for instant revert"
