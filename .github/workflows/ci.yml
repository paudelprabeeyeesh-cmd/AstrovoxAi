name: AstrovoxAI CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend Checks
  # ============================================================================
  backend-checks:
    name: Backend Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 02-Backend/requirements.txt

      - name: Install dependencies
        working-directory: 02-Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install additional testing dependencies
          pip install pytest-benchmark hypothesis pytest-mock

      - name: Check formatting (black)
        working-directory: 02-Backend
        run: black --check app tests --diff --color-only || echo "Formatting issues found"

      - name: Check linting (flake8)
        working-directory: 02-Backend
        run: flake8 app tests --max-line-length 120 --statistics --extend-ignore=E203,W503

      - name: Check linting (pylint)
        working-directory: 02-Backend
        run: pylint app tests --rcfile=./.pylintrc || echo "Linting issues found (continuing)"

      - name: Run type checking (mypy)
        working-directory: 02-Backend
        run: |
          pip install mypy
          mypy app --ignore-missing-imports --follow-imports=silent || echo "Type checking issues found (continuing)"
        
      - name: Run unit tests with coverage
        working-directory: 02-Backend
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80 --durations=10
        
      - name: Run property-based tests
        working-directory: 02-Backend
        run: |
          pytest tests/ -k "property" -v --tb=short || echo "No property-based tests found or they failed"
        
      - name: Run benchmark tests
        working-directory: 02-Backend
        run: |
          pytest tests/ -k "benchmark" --benchmark-only --benchmark-json=benchmark-report.json || echo "Benchmark tests failed or not found"
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: 02-Backend/coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
          
      - name: Upload benchmark results
        if: always() && steps.run-benchmark-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: 02-Backend/benchmark-report.json
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 02-Backend/.pytest_cache/
          
  # ============================================================================
  # Frontend Checks
  # ============================================================================
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (prettier)
        run: npm run format:check || echo "Formatting issues found"

      - name: Check linting (eslint)
        run: npm run lint || echo "Linting issues found"

      - name: Check type types (typescript)
        run: npm run typecheck || echo "Type checking issues found"

      - name: Run unit tests
        run: npm run test -- --ci --coverage --maxWorkers=50%
        
      - name: Run performance tests
        run: npm run test:perf || echo "Performance tests not configured or failed"
        
      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            **/coverage/*
            **/test-results/*
            !**/node_modules/**
            !**/dist/*

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: 02-Backend
        run: |
          pip install -r requirements.txt
          pip install safety bandit pip-audit

      - name: Check dependency vulnerabilities
        working-directory: 02-Backend
        run: |
          safety check -r requirements.txt --full-report || echo "Dependency check completed"
          pip-audit -r requirements.txt --format json > pip-audit-report.json || echo "pip-audit completed"

      - name: Run static security analysis
        working-directory: 02-Backend
        run: bandit -r app/ -f json -o bandit-report.json -ll || echo "Bandit scan completed"

      - name: Run dependency license check
        working-directory: 02-Backend
        run: pip-licenses --format=json --output=licenses.json || echo "License check completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            02-Backend/bandit-report.json
            02-Backend/pip-audit-report.json
            02-Backend/licenses.json
            !**/node_modules/**

  # ============================================================================
  # Docker Build & Security
  # ============================================================================
  docker-build:
    name: Docker Build & Security Validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build backend image
        run: |
          docker build -f 02-Backend/Dockerfile.backend -t astrovoxai/backend:ci-${{ github.sha }} .
          
      - name: Build frontend image
        run: |
          docker build -f 02-Backend/Dockerfile.frontend -t astrovoxai/frontend:ci-${{ github.sha }} .

      - name: Scan backend image for vulnerabilities
        if: secrets.DOCKER_HUB_TOKEN != ''  # Trivy needs auth for DB updates
        run: |
          docker pull aquasec/trivy:latest || true
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --format json -o backend-trivy.json astrovoxai/backend:ci-${{ github.sha }} || echo "Trivy scan completed"
          
      - name: Scan frontend image for vulnerabilities
        if: secrets.DOCKER_HUB_TOKEN != ''  # Trivy needs auth for DB updates
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --format json -o frontend-trivy.json astrovoxai/frontend:ci-${{ github.sha }} || echo "Trivy scan completed"

      - name: Upload Docker security scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-security-scans
          path: |
            *-trivy.json
            !**/node_modules/*

      - name: Test backend container
        run: |
          docker run -d --name backend-test \
            -e VITE_SUPABASE_URL=https://dummy.supabase.co \
            -e VITE_SUPABASE_ANON_KEY=dummy-key \
            -p 8000:8000 astrovoxai/backend:ci-${{ github.sha }}
          sleep 15
          http_retry=0
          max_retries=30
          until [ $http_retry -eq $max_retries ] || curl -sf http://localhost:8000/health; do
            echo "Waiting for backend to start... ($http_retry/$max_retries)"
            ((http_retry++))
            sleep 2
          done
          if [ $http_retry -eq $max_retries ]; then
            echo "Backend failed to start"
            docker logs backend-test
            exit 1
          fi
          echo "Backend started successfully"
          docker stop backend-test

      - name: Test frontend container
        run: |
          docker run -d --name frontend-test \
            -p 3000:80 astrovoxai/frontend:ci-${{ github.sha }}
          sleep 10
          http_retry=0
          max_retries=20
          until [ $http_retry -eq $max_retries ] || curl -sf http://localhost:3000; do
            echo "Waiting for frontend to start... ($http_retry/$max_retries)"
            ((http_retry++))
            sleep 2
          done
          if [ $http_retry -eq $max_retries ]; then
            echo "Frontend failed to start"
            docker logs frontend-test
            exit 1
          fi
          echo "Frontend started successfully"
          docker stop frontend-test

  # ============================================================================
  # Chaos Engineering Tests (Optional)
  # ============================================================================
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install chaos testing dependencies
        run: |
          pip install pytest pytest-timeout chaos-mesh litmuschaos
      
      - name: Run network chaos tests
        run: |
          echo "Network chaos tests would go here (requires Kubernetes cluster)"
          echo "Skipping for now - requires external cluster"
      
      - name: Run pod chaos tests
        run: |
          echo "Pod chaos tests would go here (requires Kubernetes cluster)"
          echo "Skipping for now - requires external cluster"

  # ============================================================================
  # Deploy (Production)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, security-scan, docker-build, chaos-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: astrovox-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f 02-Backend/Dockerfile.backend -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: astrovox-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f 02-Backend/Dockerfile.frontend -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster astrovox-production \
            --service astrovox-backend \
            --force-new-deployment

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster astrovox-production \
            --services astrovox-backend
          echo "Deployment successful!"

      - name: Run smoke tests
        run: |
          echo "Waiting for service to be ready..."
          sleep 30
          curl -f https://api.astrovox.ai/health || exit 1
          curl -f https://api.astrovox.ai/health/detailed || exit 1
          echo "Smoke tests passed!"

      - name: Run post-deployment validation
        if: always()
        run: |
          echo "Running post-deployment validation tests..."
          # Add any post-deployment validation steps here
          echo "Post-deployment validation completed"