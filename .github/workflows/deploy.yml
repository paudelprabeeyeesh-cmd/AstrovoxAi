name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Backend Tests
  # ============================================================================
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./02-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '02-Backend/requirements.txt'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/lib/python3.12/site-packages
          key: ${{ runner.os }}-pip-${{ hashFiles('02-Backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy bandit pip-audit

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Lint
        run: |
          ruff check app tests --max-line-length 120
          flake8 app tests --max-line-length 120 --statistics --extend-ignore=E203,W503 || true

      - name: Type check
        run: mypy app --ignore-missing-imports --follow-imports=silent || true

      - name: Security scan
        run: |
          bandit -r app/ -f json -o bandit-report.json -ll || true
          pip-audit -r requirements.txt --format json > pip-audit-report.json || true

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 30

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  # ============================================================================
  # Frontend Tests
  # ============================================================================
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint || true

      - name: Type check
        run: npm run typecheck || true

      - name: Run unit tests
        run: npm run test -- --ci --coverage --maxWorkers=50%

      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            coverage/
            test-results/
          retention-days: 30

  # ============================================================================
  # Security Scan
  # ============================================================================
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Frontend dependency audit
        run: npm audit --audit-level=high || true

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            **/gitleaks-*.json
          retention-days: 30

  # ============================================================================
  # Docker Build
  # ============================================================================
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, frontend-test, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -f Dockerfile.backend -t astrovoxai/backend:${{ github.sha }} .
          docker tag astrovoxai/backend:${{ github.sha }} astrovoxai/backend:latest
          docker push astrovoxai/backend:${{ github.sha }}
          docker push astrovoxai/backend:latest

      - name: Build and push frontend image
        run: |
          docker build -f Dockerfile.frontend -t astrovoxai/frontend:${{ github.sha }} .
          docker tag astrovoxai/frontend:${{ github.sha }} astrovoxai/frontend:latest
          docker push astrovoxai/frontend:${{ github.sha }}
          docker push astrovoxai/frontend:latest

  # ============================================================================
  # Deploy
  # ============================================================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f infrastructure/k8s/ -n astrovox || true
          kubectl set image deployment/astrovox-backend backend=astrovoxai/backend:${{ github.sha }} -n astrovox || true
          kubectl set image deployment/astrovox-frontend frontend=astrovoxai/frontend:${{ github.sha }} -n astrovox || true
          kubectl rollout status deployment/astrovox-backend -n astrovox --timeout=300s || true
          kubectl rollout status deployment/astrovox-frontend -n astrovox --timeout=300s || true

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://api.astrovox.ai/health || exit 1
          curl -f https://api.astrovox.ai/health/detailed || exit 1

      - name: Notify team
        if: always()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚀 Production deployment successful\\nVersion: ${{ github.sha }}\\nCommit: ${{ github.event.head_commit.message }}\"}" || true
