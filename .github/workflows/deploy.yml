name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      force:
        description: 'Force deployment'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push inference image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -f Dockerfile.prod -t ${{ secrets.ECR_REPO }}/inference:$IMAGE_TAG .
          docker push ${{ secrets.ECR_REPO }}/inference:$IMAGE_TAG
      - name: Deploy to ECS staging
        run: |
          aws ecs update-service --cluster astrovox-staging --service inference --force-new-deployment
      - name: Wait for deployment stability
        run: |
          aws ecs wait services-stable --cluster astrovox-staging --services inference
      - name: Run smoke tests
        run: |
          STAGING_URL=${{ secrets.STAGING_URL }}
          curl -f $STAGING_URL/health/live || exit 1
          curl -f $STAGING_URL/health/ready || exit 1
      - name: Notify deployment
        if: always()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"Staging deployment ${{ github.sha }} completed"}'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push production image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -f Dockerfile.prod -t ${{ secrets.ECR_REPO }}/inference:$IMAGE_TAG .
          docker push ${{ secrets.ECR_REPO }}/inference:$IMAGE_TAG
      - name: Run database migrations
        run: |
          alembic upgrade head
      - name: Deploy to ECS production
        run: |
          aws ecs update-service --cluster astrovox-production --service inference --force-new-deployment
      - name: Wait for deployment stability
        run: |
          aws ecs wait services-stable --cluster astrovox-production --services inference
      - name: Run production smoke tests
        run: |
          PROD_URL=${{ secrets.PRODUCTION_URL }}
          curl -f $PROD_URL/health/live || exit 1
          curl -f $PROD_URL/health/ready || exit 1
      - name: Rollback on failure
        if: failure()
        run: |
          PREVIOUS_TASK_DEF=$(aws ecs describe-services --cluster astrovox-production --services inference --query 'services[0].taskDefinition' --output text)
          aws ecs update-service --cluster astrovox-production --service inference --task-definition $PREVIOUS_TASK_DEF
      - name: Notify deployment
        if: always()
        run: |
          STATUS="succeeded"
          if [ "${{ job.status }}" == "failure" ]; then STATUS="failed"; fi
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"Production deployment ${{ github.sha }} $STATUS\"}"