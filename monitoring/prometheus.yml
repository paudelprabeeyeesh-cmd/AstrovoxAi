global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'astravox-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'astravox-frontend'
    static_configs:
      - targets: ['frontend:80']
    metrics_path: '/health'
    scheme: 'http'

  - job_name: 'astravox-monitoring'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/monitoring/metrics'
    scheme: 'http'

  - job_name: 'astravox-analytics'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/analytics/metrics'
    scheme: 'http'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
