extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  pprof:
    endpoint: "0.0.0.0:1777"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

  prometheus:
    config:
      scrape_configs:
        - job_name: 'astrovox-backend'
          static_configs:
            - targets: ['localhost:8000']
          metrics_path: '/metrics'
          scheme: 'http'

exporters:
  otlphttp:
    endpoint: "http://jaeger:4318/v1/metrics"
    headers:
      api-key: "${JAEGER_API_KEY}"

  logging:
    loglevel: info

  prometheus:
    endpoint: "0.0.0.0:8889"

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resource:
    attributes:
      - key: service.name
        value: astrovox-backend
        action: upsert

service:
  extensions: [health_check, pprof]
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, logging]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [logging]
