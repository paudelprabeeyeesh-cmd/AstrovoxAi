analytics:
  retention_days: 90
  batch_size: 1000
  flush_interval_seconds: 60

  providers:
    - name: prometheus
      enabled: true
      endpoint: http://prometheus:9090

    - name: grafana
      enabled: true
      endpoint: http://grafana:3000

  metrics:
    - name: api_usage
      type: counter
      labels: [endpoint, method, status, user_tier]

    - name: sdk_adoption
      type: gauge
      labels: [language, version]

    - name: feature_usage
      type: counter
      labels: [feature, environment]

    - name: cost_per_provider
      type: gauge
      labels: [provider, model]

  alerts:
    - name: cost_spike
      condition: increase(cost_per_request_usd[1h]) > 50
      severity: warning

    - name: adoption_drop
      condition: decrease(sdk_adoption[7d]) > 0.2
      severity: info
