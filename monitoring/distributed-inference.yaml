apiVersion: v1
kind: ServiceMonitor
metadata:
  name: distributed-inference-metrics
  namespace: astrovox-distributed
  labels:
    app: distributed-inference
spec:
  selector:
    matchLabels:
      app: distributed-inference
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: distributed-inference-alerts
  namespace: astrovox-distributed
data:
  alerts.yaml: |
    groups:
      - name: distributed-inference
        rules:
          - alert: HighInferenceLatency
            expr: histogram_quantile(0.95, sum(rate(inference_request_duration_seconds_bucket[5m])) by (le)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High inference latency detected"
              description: "P95 latency is {{ $value }}s"
          - alert: HighErrorRate
            expr: sum(rate(inference_errors_total[5m])) / sum(rate(inference_requests_total[5m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }}"
          - alert: NodeDown
            expr: up{job="distributed-inference"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Inference node is down"
              description: "Node {{ $labels.instance }} is down"
          - alert: KVCacheSyncLag
            expr: kv_cache_sync_lag_seconds > 5
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "KV cache sync lag detected"
              description: "Sync lag is {{ $value }}s"
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-inference-metrics
  namespace: astrovox-distributed
  labels:
    app: distributed-inference
    component: metrics
spec:
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: distributed-inference
---
apiVersion: v1
kind: Service
metadata:
  name: distributed-inference-logs
  namespace: astrovox-distributed
  labels:
    app: distributed-inference
    component: logging
spec:
  ports:
    - name: logs
      port: 3100
      targetPort: 3100
  selector:
    app: distributed-inference
