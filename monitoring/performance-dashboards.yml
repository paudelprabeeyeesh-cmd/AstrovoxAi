apiVersion: 1

providers:
  - name: 'AstrovoxAI Performance Dashboards'
    orgId: 1
    folder: 'AstrovoxAI Performance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/performance
      foldersFromFilesStructure: true
