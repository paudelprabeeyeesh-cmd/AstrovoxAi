vocab_size: 32000
hidden_size: 512
num_hidden_layers: 8
num_attention_heads: 8
intermediate_size: 2048
max_position_embeddings: 1024
dropout: 0.0
layer_norm_epsilon: 1e-5
attention_bias: false
mlp_bias: false
tie_weights: true
activation: swiglu
rope_theta: 10000.0
batch_size: 4
epochs: 3
lr: 3e-4
gradient_accumulation_steps: 8
gradient_checkpointing: true
mixed_precision: fp16
train_file: "data/train.txt"
tokenizer_path: "tokenizer.json"
output_dir: "models/llm/checkpoints/50m/model.pt"
checkpoint_dir: "models/llm/checkpoints/50m"
log_dir: "models/llm/logs/50m"
checkpoint_every_steps: 100
max_val_batches: 10
gradient_clip_norm: 1.0
warmup_steps: 100
min_lr: 1e-6
lr_scheduler: cosine
optimizer: adamw
seed: 42
