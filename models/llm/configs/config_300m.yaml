vocab_size: 32000
hidden_size: 1024
num_hidden_layers: 16
num_attention_heads: 16
intermediate_size: 4096
max_position_embeddings: 1024
dropout: 0.0
layer_norm_epsilon: 1e-5
attention_bias: false
mlp_bias: false
tie_weights: true
activation: swiglu
rope_theta: 10000.0
batch_size: 2
epochs: 3
lr: 3e-4
gradient_accumulation_steps: 16
gradient_checkpointing: true
mixed_precision: bf16
train_file: "data/train.txt"
tokenizer_path: "tokenizer.json"
output_dir: "models/llm/checkpoints/300m/model.pt"
checkpoint_dir: "models/llm/checkpoints/300m"
log_dir: "models/llm/logs/300m"
checkpoint_every_steps: 50
max_val_batches: 10
gradient_clip_norm: 1.0
warmup_steps: 200
min_lr: 1e-6
lr_scheduler: cosine
optimizer: adamw
seed: 42
