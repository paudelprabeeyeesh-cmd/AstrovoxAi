vocab_size: 32000
hidden_size: 1280
num_hidden_layers: 25
num_attention_heads: 16
intermediate_size: 5120
max_position_embeddings: 1024
dropout: 0.0
layer_norm_epsilon: 1e-5
attention_bias: false
mlp_bias: false
tie_weights: true
activation: swiglu
rope_theta: 10000.0
batch_size: 1
epochs: 2
lr: 2e-4
gradient_accumulation_steps: 32
gradient_checkpointing: true
mixed_precision: bf16
train_file: "data/train.txt"
tokenizer_path: "tokenizer.json"
output_dir: "models/llm/checkpoints/700m/model.pt"
checkpoint_dir: "models/llm/checkpoints/700m"
log_dir: "models/llm/logs/700m"
checkpoint_every_steps: 50
max_val_batches: 10
gradient_clip_norm: 1.0
warmup_steps: 300
min_lr: 1e-6
lr_scheduler: cosine
optimizer: adamw
seed: 42
